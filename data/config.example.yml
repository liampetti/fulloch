# Fulloch configuration. On first run the setup wizard copies this file to
# data/config.yml and writes secrets (HA token, API keys) into
# data/credentials.json. Env vars take precedence over credentials.json.

# === General ================================================================
general:
  wakeword: "hey atticus"        # also the fallback if wakeword_pattern fails to compile
  # wakeword_pattern: '\b(?:hey|hay|hi)\W+[ao][dtl]{1,2}i?c\W*u[sz]\b'  # auto-built from wakeword when blank

  asr_language: "English"        # English only for now
  log_level: "info"              # debug | info | warning | error

  asr_context_hint: true         # bias ASR decoder toward your wakeword spelling
  # asr_context_terms:            # extra proper nouns/names (max 10)
  #   - "phoebe bridgers"

  # timezone: "Australia/Sydney"  # IANA name; auto-detected from the browser

  # === Voice ================================================================
  voice_clone: "atticus"         # Qwen/Pocket: data/voices/<name> clone. Kokoro: built-in name.
  tts_speed: 1.0                 # Kokoro only; Qwen/Pocket pace comes from the reference clip.
  whisper_gain: 0.30             # Volume for explicit whisper/quiet requests (0.0-1.0; applies to every TTS backend).
  personality: "balanced"       # balanced | playful | calm | wry | custom; applies to every model.
  # personality_custom: "Warm and reassuring; use pauses sparingly."  # Used when personality: custom.
  barge_in: "wakeword"           # off | wakeword — interrupt mid-response
  conversation_mode_default: false # exclusive full-duplex, no-wakeword voice session.
  follow_up_time: "5s"           # wakeword-free reply window after TTS; "0s" disables.

  # === Endpointing ==========================================================
  use_vad: true                  # Silero VAD; falls back to RMS energy when off/unavailable.
  barge_in_threshold_dbfs: -48   # raise if the assistant interrupts itself.
  vad_threshold: 0.6             # raise toward 0.7 in noisy rooms.
  vad_endpoint_silence_ms: 1500  # low-VAD duration before end-of-speech.
  vad_min_speech_ms: 300         # filter coughs/taps the VAD scores as speech.
  vad_soft_endpoint_silence_ms: 500  # early-commit pause; 0 disables. Locks/media/timers always wait for the hard endpoint.

  # === Dashboard ============================================================
  dashboard_theme: "auto"       # auto | dark | light; auto follows the browser/OS preference.
  dashboard_show_turn_details: false # expand agent-loop and inference details for every dashboard turn.
  dashboard_port: 8765
  dashboard_host: "127.0.0.1"    # 0.0.0.0 to expose to LAN (set a dashboard password first).
  # HTTPS — both paths required, or TLS is skipped. Under Docker the files
  # must live under ./data. A self-signed cert is generated on first install.
  # When HTTPS is on, a tiny dispatcher fronts the same port: http://
  # requests get a 308 redirect to https://, https:// requests are proxied
  # through to the TLS listener — one port handles both schemes.
  # dashboard_ssl_certfile: "./data/certs/dashboard.crt"
  # dashboard_ssl_keyfile:  "./data/certs/dashboard.key"
  # Obsidian desktop connects over WSS and requires an OS-trusted certificate;
  # accepting a browser warning is not enough. On the Fulloch host, create a
  # private CA-signed leaf with its LAN IP/name, then install ONLY the public
  # data/certs/fulloch-home-ca.crt on every Obsidian computer:
  #   python scripts/create_local_ca.py --force --ip 192.168.1.50
  #   Linux: sudo cp data/certs/fulloch-home-ca.crt /usr/local/share/ca-certificates/ && sudo update-ca-certificates
  # Restart Fulloch and Obsidian afterwards. Never copy or install
  # data/certs/fulloch-home-ca.key.

# === Models =================================================================
# Omit the block to use the stack defaults. The wizard writes this block from
# the chosen tier. The language model is either `local` (a bundled GGUF) or
# `external` (an OpenAI-compatible server).
#
# models:
#   asr:
#     backend: qwen              # Qwen3 1.7B PyTorch (default GPU)
#     # qwen-gguf                # Qwen3 1.7B GGUF (GPU)
#     # qwen-gguf-small          # Qwen3 0.6B GGUF (GPU)
#     # qwen-onnx                # Qwen3 1.7B ONNX (default CPU)
#     # qwen-onnx-small          # Qwen3 0.6B ONNX (CPU)
#     # qwen-small               # Qwen3 0.6B PyTorch (GPU)
#     # moonshine                 # Moonshine Base (CPU)
#     # moonshine-tiny            # Moonshine Tiny (CPU)
#   tts:
#     backend: qwen              # Qwen3 1.7B PyTorch (default GPU)
#     # higgs-gguf               # Higgs TTS 3 Q4 GGUF (GPU, experimental)
#     # qwen-gguf                # Qwen3 1.7B GGUF (GPU)
#     # qwen-gguf-small          # Qwen3 0.6B GGUF (GPU)
#     # qwen-small               # Qwen3 0.6B PyTorch (GPU)
#     # kokoro-onnx              # Kokoro 82M (default CPU)
#     # pocket-tts-onnx          # Pocket TTS ONNX (experimental CPU one-shot WAV voice clone)
#   llm:
#     backend: local             # local | external
#     local_model: qwen          # qwen (recommended) | gemma | custom
#     # model: "/path/to/model.gguf"  # Required only when local_model: custom.
#     # n_context: 12288         # Optional; larger contexts use more VRAM.
#
# External LLM (llama.cpp server / vLLM / Ollama / hosted API):
#   llm:
#     backend: external
#     base_url: "http://localhost:8888/v1"
#     model: ""                 # Optional; blank uses a single-model server's default.
#     connect_timeout: 0.4
#     read_timeout: 60

# === Multi-satellite (/ws/satellite-v2) =====================================
# Tokens accepted from non-browser /ws/satellite-v2 clients (any one in the
# list authorises a connection). Leave unset to accept connections
# unauthenticated. The browser dashboard's /ws/satellite is unaffected.
# satellite_tokens:
#   - "a-long-random-token-per-device-or-shared-is-fine"

# === Home Assistant ========================================================
# Long-lived access token: ha_token in data/credentials.json. Rename entities
# in HA to change the spoken name; restart Fulloch to refetch the alias map.
#
# home_assistant:
#   url: "http://192.168.1.50:8123"
#   timeout: 10
#   spotify_entity: "media_player.sonos_living_room"  # default media_player; also the play_song target
#   todo_entity: "Shopping list"   # HA todo list; auto-detected if blank
#   calendar: "Fulloch"           # HA calendar Fulloch reads/writes reminders to
#   reminder_poll: true            # set false if a HA automation calls fulloch.speak

# === Spotify (Web API search; hands URI to HA) =============================
# No spotify: block ⇒ no play_song tool. Run scripts/spotify_auth.py once for
# the OAuth refresh token; put spotify_client_id/_secret/_refresh_token into
# data/credentials.json.
#
# spotify:
#   redirect_uri: "http://127.0.0.1:8080/callback"
#   device_id: "Living Room"      # Spotify Connect device name; first available if unset

# === Notes (local markdown store) ===========================================
# notes:
#   path: "./data/notes"          # all normal notes and fulloch_facts.md; can point at an Obsidian vault
#   daily_subdir: "daily"         # daily-journal notes land in <path>/<daily_subdir>/

# === Obsidian plugin bridge (Docker only) ==================================
# Map host-prefix → container-prefix so vault paths reported by the host-side
# Obsidian plugin resolve under Docker (the plugin runs on the host, the
# container can't see its paths otherwise). README has the matching -v mount.
# obsidian:
#   path_translation:
#     "/Users/you/Documents/MyVault": "/vault"
#   allow_edit_delete: false       # Explicit active-note cursor insert, selected-text replacement, rename, or delete via plugin; keep off unless needed.
# The plugin's host setting must use the HTTPS dashboard address, for example
# https://192.168.1.50 (port 8765), not a bare host or http:// URL.

# === Search (SearXNG) ======================================================
search:
  searxng_url: "http://localhost:8080/search"
