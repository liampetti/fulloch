services:
  # Fulloch AI - GPU
  app:
    # Pull the precompiled image from GHCR (the slow CUDA + flash-attn build runs
    # once in CI). `docker compose pull` fetches it; `docker compose build` still
    # rebuilds locally from the Dockerfile below. Override the tag with
    # FULLOCH_VERSION in .env (e.g. v2.2.0) to pin a release.
    image: ghcr.io/liampetti/fulloch:${FULLOCH_VERSION:-latest}
    build:
      context: .
    # Optional: load extra vars (HA/dashboard tokens, audio device pins) if you
    # create one. Absent is fine — `docker compose up` works with zero host prep
    # and the in-container wizard handles config.
    env_file:
      - path: .env
        required: false
    container_name: fulloch-ai
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      # XDG_RUNTIME_DIR is set in a desktop session; default to the conventional
      # path so a headless/unset shell doesn't produce a malformed mount.
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
      # Route the container's "default" audio through specific Pulse/PipeWire
      # devices (PipeWire handles resampling, unlike a raw ALSA hw: device).
      # Defaults to the host's system-default source/sink; set PULSE_SOURCE /
      # PULSE_SINK in .env to pin a specific device by its pactl name.
      - PULSE_SOURCE=${PULSE_SOURCE:-@DEFAULT_SOURCE@}
      - PULSE_SINK=${PULSE_SINK:-@DEFAULT_SINK@}
    volumes:
      - ./data:/app/data:rw
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse:ro
      # Mount the whole pulse config dir (not just the cookie file): if the
      # cookie is absent Docker would otherwise create a bogus directory in its
      # place. PipeWire systems may not create one — `touch ~/.config/pulse/cookie`
      # if audio auth fails after setup.
      - ${HOME}/.config/pulse:/home/appuser/.config/pulse:ro
      # Inherit the host's timezone so `datetime.now()` in time_tools /
      # datetime_utils reports local wall-clock time (not UTC, which Docker
      # defaults to).
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # Liveness probe. Prefers the dashboard /status endpoint (catches a hung /
    # OOM process that's still "running" but no longer serving) and falls back
    # to a process check when the dashboard is disabled, served over HTTPS, or
    # on a non-default port. DASHBOARD_PORT (.env) must match
    # general.dashboard_port in data/config.yml for the curl probe to be the
    # deciding check; otherwise it degrades to the pgrep fallback. Only acted on
    # by an orchestrator / autoheal sidecar — plain `restart: unless-stopped`
    # ignores health status.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${DASHBOARD_PORT:-8765}/status || pgrep -f 'python app.py' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

