<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8faf9">
<title>Fulloch — Setup</title>
<link rel="icon" href="/logo.png" type="image/png">
<script>
  // Apply the stored appearance (or the OS default) before first paint so the
  // page never flashes the wrong theme. Mirrors Blowfish's class-based system:
  // a `dark` class on <html>, localStorage["appearance"] = "light"|"dark", with
  // the OS preference as the default when the user hasn't picked one.
  (() => {
    const stored = localStorage.getItem('appearance');
    const prefersDark = window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (stored === 'dark' || (stored === null && prefersDark)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
<link rel="stylesheet" href="/static/css/setup.css">
<script src="/static/js/setup.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <img id="brand-logo" src="/logo.png" alt="">
    <div>
      <div class="title" id="brand-title">Fulloch</div>
      <div class="sub" id="subtitle">Starting up</div>
    </div>
  </header>

  <div id="alert"></div>
  <div id="steps" class="steps"></div>
  <div id="screen"></div>
</div>
</body>
</html>
