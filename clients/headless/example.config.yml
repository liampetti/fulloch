# Fulloch headless satellite — example config
#
# Copy this file to config.yml and edit to match your setup.
# Run: python satellite.py --config config.yml

server:
  host: "192.168.1.50"          # Fulloch server address
  port: 8765                    # dashboard port
  # ssl: false                  # set false to use ws:// instead of wss://
  # ca_cert: "/path/to/fulloch-home-ca.crt"  # required for Fulloch's self-signed/private-CA HTTPS
  token: "my-satellite-token"   # matched against satellite_tokens in the server's config.yml

satellite:
  room: "kitchen"               # label shown in the busy banner on other satellites

audio:
  # mic_device: null            # sounddevice input device name or index
  # speaker_device: null        # sounddevice output device name or index
  # full_duplex: false          # true only with an AEC-capable device
