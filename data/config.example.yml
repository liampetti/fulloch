# Fulloch Configuration Example — copy to config.yml and fill in your values.

# =============================================================================
# General Settings
# =============================================================================
general:
  wakeword: "hey atticus"       # Activation phrase (case-insensitive, multi-word ok), also acts as fallback if regex option is enabled and fails
  wakeword_pattern: '\b(?:hey|hay|hi)\W+[ao][dtl]{1,2}i?c\W*u[sz]\b' # Optional regex override (compiled case-insensitive) to tolerate ASR variants
  voice_clone: "atticus"        
  barge_in: "wakeword"          # "off" (half-duplex) | "wakeword" (needs AEC)
  follow_up_time: "5s"          # "0s" | "<N>s" wakeword-free window after TTS, allows for conversational discussions in quieter environments
  asr_language: "English"       # Force speech detection and transcription to a single language, only English supported currently.
  use_vad: true                 # Buffers with no detected speech frames are dropped before ASR, eliminating hallucinated words from coughs, keyboard taps, and background noise.
  asr_context_hint: true        # Inject "Technical terms: <wakeword>" as a system prompt on every ASR call, biasing the decoder toward your wakeword spelling. 
  # asr_context_terms:          # Optional extra terms appended after the wakeword. Add proper nouns or names that get consistently mistranscribed. (Max 10)
  #   - "phoebe bridgers"     
  #   - "downstairs office"   

  log_level: "info"           # "debug" | "info" | "warning" | "error" (debug = verbose project-side logs)

  # ALSA device substrings; null = system default. AEC routing for
  # barge-in is configured via PULSE_SOURCE / PULSE_SINK in compose.yml.
  # input_device: null
  # output_device: null

  # Web chat UI. Set port to enable; unset disables.
  dashboard_port: 8765
  dashboard_host: "0.0.0.0"   # 127.0.0.1 (default) = local-only

# =============================================================================
# Home Assistant — smart-home backend
# =============================================================================
# Create a long-lived token at http://<your-ha>:8123/profile.
# Rename entities in the HA UI to change the spoken name, then restart Fulloch.

# home_assistant:
#   url: "http://192.168.1.50:8123"
#   token: "your_long_lived_access_token"
#   timeout: 10
#   spotify_entity: "SpotifyPlus Atticus"  # Friendly name (or entity_id) of the Spotify
#                                               # media_player. Auto-detected from HA on startup
#                                               # (first media_player.spotify* entity). Set this
#                                               # if autodetect picks the wrong player or fails.
#   todo_entity: "Shopping list"  # Friendly name (or entity_id) of the HA todo list for
#                                   # voice shopping/task items. Auto-detected: prefers
#                                   # todo.shopping_list, then the first todo.* entity.
#   calendar: "Fulloch"   # Friendly name of the HA calendar Fulloch writes reminders to.
#                          # Create a Local Calendar (or Google Calendar via HA) named "Fulloch"
#                          # in HA. Fulloch will poll this calendar every 60 seconds and speak
#                          # any event starting within the next 90 seconds via speak_proactive.
#   reminder_poll: false  # Uncomment to disable the polling thread — e.g. if you have set up
#                          # a HA automation to call fulloch.speak on calendar events instead,
#                          # or if you don't want voice feedback for reminders.

# =============================================================================
# Always-Available Tools
# =============================================================================

# Notes — local markdown store (read / write / append / search).
# Leave commented to use the default ./data/notes folder. Point `path` at an
# existing Obsidian vault (or any markdown folder) to use that instead.
# notes:
#   path: "./data/notes"      # where notes are stored
#   daily_subdir: "daily"     # optional: daily-journal notes go here as YYYY-MM-DD.md

search:
  searxng_url: "http://localhost:8080/search"
