<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8faf9">
<title>Fulloch — Setup</title>
<link rel="icon" href="/logo.png" type="image/png">
<script>
  // Use the saved dashboard preference when available; setup defaults to Auto.
  (() => {
    const theme = window.FULLOCH_DASHBOARD_PREFS?.theme || 'auto';
    const prefersDark = window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (theme === 'dark' || (theme === 'auto' && prefersDark)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
<link rel="stylesheet" href="/static/css/setup.css">
<script src="/static/js/setup.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <img id="brand-logo" src="/logo.png" alt="">
    <div>
      <div class="title" id="brand-title">Fulloch</div>
      <div class="sub" id="subtitle">Starting up</div>
    </div>
  </header>

  <div id="alert"></div>
  <div id="steps" class="steps"></div>
  <div id="screen"></div>
</div>
</body>
</html>
