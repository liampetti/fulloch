language: de
settings:
  filter_with_regex: false
lists:
  color:
    values:
    - in: wei(ß|ss)
      out: white
    - in: schwarz
      out: black
    - in: rot
      out: red
    - in: orange
      out: orange
    - in: gelb
      out: yellow
    - in: grün
      out: green
    - in: blau
      out: blue
    - in: violett
      out: purple
    - in: braun
      out: brown
  brightness:
    range:
      type: percentage
      from: 0
      to: 100
  brightness_level:
    values:
    - in: (max[imal[e]|imum]|höchste|volle)
      out: 100
    - in: (min[imal[e]|imum]|niedrigste)
      out: 1
  cover_states:
    values:
    - in: (offen|auf|oben|geöffnet)
      out: open
    - in: (geschlossen|zu|unten)
      out: closed
    - in: ([am ]öffnen|öffnet)
      out: opening
    - in: ([am ]schlie(ß|ss)en|schlie(ß|ss)t)
      out: closing
  cover_classes:
    values:
    - in: (Markise[n]|Beschattung[en])
      out: awning
    - in: (Jalousie[n]|Rollo[s])
      out: blind
    - in: (Gardine[n]|Vorhang|Vorhänge)
      out: curtain
    - in: Tür[e|en]
      out: door
    - in: (Garagentür[e|en]|Garagentor[e])
      out: garage
    - in: Tor[e]
      out: gate
    - in: Schirm[e]
      out: shade
    - in: (Roll[l](a|ä)den)
      out: shutter
    - in: Fenster
      out: window
  lock_domains:
    values:
    - in: (Schloss|Schlösser|Tür[e|en]|Tor[e])
      out: lock
  lock_states:
    values:
    - in: (([ab|zu]ge|ver)(schlossen|sperrt)|verriegelt)
      out: locked
    - in: (nicht (([ab|zu]ge|ver)(schlossen|sperrt)|verriegelt)|ent(riegelt|sperrt)|aufge(sperrt|schlossen))
      out: unlocked
  on_off_domains:
    values:
    - in: (Lampe[n]|Licht[er]|Leuchte[n]|Beleuchtung[en])
      out: light
    - in: (Ventilator[en]|Lüfter)
      out: fan
    - in: Schalter
      out: switch
  on_off_states:
    values:
    - in: ((an|ein)[geschaltet]|auf)
      out: 'on'
    - in: ((aus|ab)[geschaltet]|zu)
      out: 'off'
  temperature:
    range:
      type: temperature
      from: 0
      to: 100
  bs_battery_states:
    values:
    - in: (niedrig|gering|schwach)
      out: 'on'
    - in: normal
      out: 'off'
  bs_battery_charging_states:
    values:
    - in: (lädt|[auf][ge]laden)[ auf]
      out: 'on'
    - in: (lädt nicht|nicht[ auf][ge]laden|laden nicht)[ auf]
      out: 'off'
  bs_carbon_monoxide_states:
    values:
    - in: <erkannt>
      out: 'on'
    - in: (klar|rein|sauber|sicher)
      out: 'off'
  bs_cold_states:
    values:
    - in: kalt
      out: 'on'
    - in: normal
      out: 'off'
  bs_connectivity_states:
    values:
    - in: verbunden
      out: 'on'
    - in: getrennt
      out: 'off'
  bs_door_states:
    values:
    - in: (auf|offen|geöffnet)
      out: 'on'
    - in: (zu|geschlossen)
      out: 'off'
  bs_garage_door_states:
    values:
    - in: (auf|offen|geöffnet|oben)
      out: 'on'
    - in: (zu|geschlossen|unten)
      out: 'off'
  bs_window_states:
    values:
    - in: (auf|offen|geöffnet|gekippt)
      out: 'on'
    - in: (zu|geschlossen)
      out: 'off'
  bs_gas_states:
    values:
    - in: <erkannt>
      out: 'on'
    - in: (klar|rein|sauber|sicher)
      out: 'off'
  bs_heat_states:
    values:
    - in: hei(ß|ss)
      out: 'on'
    - in: normal
      out: 'off'
  bs_light_states:
    values:
    - in: <erkannt>
      out: 'on'
    - in: kein Licht
      out: 'off'
  bs_problem_states:
    values:
    - in: <erkannt>
      out: 'on'
    - in: (ok[ay]|normal)
      out: 'off'
  bs_safety_states:
    values:
    - in: (unsicher|gefährlich)
      out: 'on'
    - in: (sicher|ungefährlich)
      out: 'off'
  shopping_list_item:
    wildcard: true
  zone:
    wildcard: true
  position:
    range:
      type: percentage
      from: 0
      to: 100
  position_level:
    values:
    - in: (max[imal[e]|imum]|höchste)
      out: 100
    - in: (min[imal[e]|imum]|niedrigste)
      out: 1
  volume_level:
    range:
      type: percentage
      from: 0
      to: 100
  volume_mapping:
    values:
    - in: (max[imal[e]|imum]|höchste|volle)
      out: 100
    - in: (min[imal[e]|imum]|niedrigste)
      out: 1
  timer_seconds:
    range:
      from: 1
      to: 100
  timer_minutes:
    range:
      from: 1
      to: 100
  timer_hours:
    range:
      from: 1
      to: 100
  timer_name:
    wildcard: true
  timer_command:
    wildcard: true
  message:
    wildcard: true
  search_query:
    wildcard: true
expansion_rules:
  artikel_bestimmt: '[(der|die|das|dem|den|des)]'
  artikel_unbestimmt: '[(ein|eine|eines|einer|einem|einen)]'
  artikel: '[<artikel_bestimmt>|<artikel_unbestimmt>]'
  name: <artikel_bestimmt> {name}
  area: '[in|an|auf|bei][ (<artikel_bestimmt>|im|am|<von_dem>)] {area}[s]'
  floor: '[in|auf][ (<artikel_bestimmt>|im|<von_dem>)] {floor}[ Geschoss]'
  area_floor: (<area>|<floor>)
  an: (an|ein|auf)
  aus: (aus|ab|zu)
  auf: (auf|hoch|[he]rauf|nach oben)
  zu: (zu|[he]runter|nach unten)
  von_dem: (von[ dem]|vom)
  zu_dem: (zu[ dem]|zum)
  alle: ((alle|sämtliche)[r]|jede[r|s|n]|(die|der) (ganze|komplette|sämtliche)[n])[
    der]
  schliessen: (schlie(ß|ss)[e|en]|zumachen|zu machen)
  öffnen: (öffne[n]|aufmachen|auf machen)
  schalten: (schalt[e|en|et])
  machen: (mach[e|en|t])
  fahren: (fahr[e|en|t])
  setzen: (setz[e|en]|stell[e|en]|einstellen|änder[e|n]|veränder[e|n])
  abdeckung: '[(das|die|der|den) ](Rollo[s]|Abdeckung[en]|Roll[l](a|ä)den|Jalousie[n]|Raffstore[s]|Markise[n]|Vorh(a|ä)ng[e]|Beschattung[en])'
  alle_abdeckungen: <alle> (Rollos|Abdeckungen|Roll[l](a|ä)den|Jalousien|Raffstores|Markisen|Vorhänge|Beschattungen)
  garage: '[(die|das) ](Garage[n]|Garagentor[e])'
  alle_garagen: <alle> (Garagen[tore])
  tor: '[(das|die) ]Tor[e]'
  alle_tore: <alle> (Tore|Garagentore)
  luefter: '[(der|die|den) ](Ventilator[en]|Lüfter)'
  alle_luefter: <alle> (Ventilatoren|Lüfter)
  brightness: '{brightness}[ (Prozent|%)]'
  temperature: '{temperature}[ ][°|Grad]'
  licht: '[(das|die) ](Licht|Lampe|Beleuchtung)'
  lichtes: ([des ](Lichts|Lichtes)|[der ](Lampe|Beleuchtung))
  lichter: '[(die|der|von den) ](Lichter|Lichtern|Lampen|Leuchten|Beleuchtungen)'
  alle_lichter: (<alle> (<lichter>|Beleuchtung)|von allen[ (Lichtern|Lampen|Leuchten|Beleuchtungen)])
  leuchten_lassen: ([er]leuchten lassen|[ein]färben)
  tuer: '[die ]Tür[e|en]'
  schloss: '[(das|die) ](Schloss|Schlösser)'
  sperren: (sperr|schlie(ss|ß))[e|en]
  entsperren: ((ent|auf)<sperren>|öffne|entrieg(el|le))[n]
  absperren: (zu|ab)<sperren>|verrieg(el|le)[n]
  aktivieren: aktivier[e|en]
  deaktivieren: de<aktivieren>
  ausfuehren: (start[e|en]|ausführen)
  szene: '[die ]Szene'
  skript: '[das ]Skript'
  batterie: '[(der|des) ](Batterie[n]|Akku[s])'
  irgend: (irgend(<artikel_unbestimmt>[s]|welche[s]|wo)|(einige|manche)[s]|<artikel_unbestimmt>[s])
    <artikel_bestimmt>
  etwas: '[irgend][et]was'
  welche: (welche[r|s|n]|was für[ <artikel_unbestimmt>[s]]) <artikel_bestimmt>
  wieviel: (wie[ ]viel[e]|welche Anzahl[ (an|von)])
  ladestand: '[der][ Lade][zu]Stand'
  co: Kohlen[stoff]monoxid
  co_sensor: <co>[-]Sensor[en]
  gas_sensor: Gas[-]Sensor[en]
  ding: ((Ding|Gerät)[e|en]|Sensor[en]|Gegenstand|Gegenstände[n])
  erkannt: (entdeckt|ausgelöst|erkannt|an)
  ist_wurde: (ist|wurde)
  sind_wurden: (sind|wurden)
  position: '{position}[ (Prozent|%)]'
  volume: '{volume_level}[ (Prozent|%)]'
  im_bereich: '[((in|auf)[ <artikel_bestimmt>]|im)] {zone:state}'
  im_zuhause: (zu Hause|[im ]Zuhause)
  timer_set: (starte|setze|stelle|erstelle)
  timer_cancel: (beende|stopp[e]|lösch[e])
  timer_duration_seconds: '{timer_seconds:seconds} Sekunde[n]'
  timer_duration_minutes: '{timer_minutes:minutes} Minute[n][ [und]{timer_seconds:seconds}
    Sekunde[n]]'
  timer_duration_hours: '{timer_hours:hours} Stunde[n][ [und]{timer_minutes:minutes}
    Minute[n]][ [und]{timer_seconds:seconds} Sekunde[n]]'
  timer_duration: <timer_duration_seconds>|<timer_duration_minutes>|<timer_duration_hours>
  timer_start_seconds: '{timer_seconds:start_seconds} Sekunde[n]'
  timer_start_minutes: '{timer_minutes:start_minutes} Minute[n][ [und]{timer_seconds:start_seconds}
    Sekunde[n]]'
  timer_start_hours: '{timer_hours:start_hours} Stunde[n][ [und]{timer_minutes:start_minutes}
    Minute[n]][ [und]{timer_seconds:start_seconds} Sekunde[n]]'
  timer_start: <timer_start_seconds>|<timer_start_minutes>|<timer_start_hours>
  naechster: nächste[r|s|n]
  vorheriger_letzter: (vorherige|letzte)[r|s|n]
  starte: (starte|spiele)
  wiederhole: (wiederhole[ <artikel_bestimmt>]|zurück <zu_dem>)
  song: (Titel|Lied|Song|Track|Stück)
  media_type: (musik|[fernseh]sendung|gerät[e])
skip_words:
- bitte
- danke
- gefälligst
- jetzt
- sofort
- gleich
- gerade
- momentan
- im Moment
- mal
- eben
- kannst du
- könntest du
- würdest du
- du sollst
- ähm
- äh
intents:
