<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8faf9">
<title>Fulloch — Setup</title>
<link rel="icon" href="/logo.png" type="image/png">
<script>
  (() => {
    const stored = localStorage.getItem('appearance');
    const prefersDark = window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (stored === 'dark' || (stored === null && prefersDark)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
<style>
  :root {
    --bg: #f8faf9; --surface: #ffffff; --surface-2: #f0f4f2;
    --text: #1b2722; --text-muted: #64746e; --border: rgba(14,23,19,0.1);
    --primary: #2f7d62; --primary-fg: #ffffff; --warn: #b5701b; --error: #c0392b;
  }
  html.dark {
    --bg: #121815; --surface: #1b2722; --surface-2: #232f29;
    --text: #e7efea; --text-muted: #9bb0a7; --border: rgba(255,255,255,0.12);
    --primary: #5cc6a0; --primary-fg: #08130e; --warn: #e0a458; --error: #e57368;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    line-height: 1.5; padding: 1.5rem;
  }
  .wrap { max-width: 46rem; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
  header img { width: 44px; height: 44px; }
  header .title { font-size: 1.3rem; font-weight: 700; }
  header .sub { color: var(--text-muted); font-size: 0.85rem; }
  .steps { display: flex; gap: 0.4rem; margin: 0 0 1.25rem; flex-wrap: wrap; }
  .steps .s {
    font-size: 0.72rem; color: var(--text-muted); padding: 0.2rem 0.55rem;
    border-radius: 99px; border: 1px solid var(--border); background: var(--surface);
  }
  .steps .s.active { color: var(--primary-fg); background: var(--primary); border-color: var(--primary); }
  .steps .s.done { color: var(--primary); border-color: var(--primary); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 1.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.05); }
  h2 { margin: 0 0 0.35rem; font-size: 1.1rem; }
  .lead { color: var(--text-muted); margin: 0 0 1.25rem; font-size: 0.92rem; }
  .opt { border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 0.75rem;
    cursor: pointer; transition: border-color .15s, background .15s; background: var(--surface); }
  .opt:hover { background: var(--surface-2); }
  .opt.sel { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent); }
  .opt .row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .opt .name { font-weight: 600; }
  .opt .blurb { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem; }
  .badge { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 99px; white-space: nowrap; }
  .badge.ok { color: var(--primary); border: 1px solid var(--primary); }
  .badge.warn { color: var(--warn); border: 1px solid var(--warn); }
  .badge.rec { color: var(--primary-fg); background: var(--primary); }
  .actions { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 1.5rem; }
  button, .btn { font: inherit; cursor: pointer; border-radius: 10px; padding: 0.55rem 1.1rem;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    transition: background .15s, border-color .15s, color .15s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 0.4rem; }
  button:hover, .btn:hover { background: var(--surface-2); border-color: var(--text-muted); }
  button.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); font-weight: 600; }
  button.primary:hover { filter: brightness(1.05); background: var(--primary); }
  button.danger { background: transparent; color: var(--error); border-color: var(--error); }
  button.danger:hover { background: color-mix(in srgb, var(--error) 12%, transparent); border-color: var(--error); }
  button:disabled { opacity: 0.5; cursor: default; }
  /* Back / secondary buttons — subtle. */
  .back { background: transparent; color: var(--text-muted); border-color: transparent; padding-left: 0.6rem; }
  .back:hover { color: var(--text); background: var(--surface-2); border-color: var(--border); }
  /* Crisp CSS chevrons (drawn from borders, scale with the font + currentColor)
     instead of janky ← / → glyphs. Rendered as flex items via the buttons'
     inline-flex + gap, so they sit centred next to the label. */
  .back::before, .next::after {
    content: ""; width: 0.4em; height: 0.4em; flex: none;
    border: solid currentColor; border-width: 0 2px 2px 0;
  }
  .back::before { transform: rotate(135deg); }   /* points left */
  .next::after  { transform: rotate(-45deg); }    /* points right */
  /* Sticky settings top bar with the dashboard back button. */
  .topbar { position: sticky; top: -1.5rem; z-index: 5; display: flex; align-items: center;
    gap: 0.75rem; padding: 0.75rem 0; margin: -0.5rem 0 1rem; background: var(--bg);
    border-bottom: 1px solid var(--border); }
  .topbar h2 { margin: 0; font-size: 1.05rem; }
  .topbar .spacer { flex: 1; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 0.9rem 0 0.3rem; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; font: inherit; padding: 0.5rem 0.6rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  textarea { resize: vertical; min-height: 4rem; }
  .help { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.2rem; }
  /* An auto-generated value shown for reference (e.g. the wakeword pattern):
     muted until the user edits it, when it becomes a real (solid) custom value. */
  input.ghost { color: var(--text-muted); font-style: italic; }
  .muted { color: var(--text-muted); }
  details.advanced { padding-bottom: 0.75rem; }
  details.advanced summary { cursor: pointer; font-size: 0.85rem; color: var(--text-muted); }
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
  @media (min-width: 36rem) { .grid2 { grid-template-columns: 1fr 1fr 1fr; } }
  .asset { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0; border-top: 1px solid var(--border); }
  .asset .bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .asset .bar > i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .3s; }
  .asset .st { font-size: 0.75rem; color: var(--text-muted); min-width: 5.5rem; text-align: right; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 1.5rem auto; }
  .spinner.sm { width: 16px; height: 16px; border-width: 2px; margin: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Live loading terminal: streams first-party logs while models load. Dark in
     both themes (it's a console). Top lines fade out via the mask as newer
     lines push them up; new lines fade in (termIn). */
  .term { margin: 1.25rem 0 0; height: 11rem; padding: 0.85rem 1rem; overflow: hidden;
    background: #0c1310; border: 1px solid var(--border); border-radius: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem; line-height: 1.55; color: #8fd9bd;
    display: flex; flex-direction: column; justify-content: flex-end;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 2.75rem);
            mask-image: linear-gradient(to bottom, transparent 0, #000 2.75rem); }
  .term-line { white-space: pre-wrap; word-break: break-word; animation: termIn .45s ease both; }
  .term-line::before { content: "› "; color: #3f7a64; }
  .term-line.warn { color: #e0a458; }
  .term-line.error { color: #e57368; }
  @keyframes termIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .term-foot { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.9rem; }
  .term-foot .muted { font-size: 0.8rem; }
  .token-box { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; word-break: break-all; margin: 0.75rem 0; }
  .banner { padding: 0.7rem 0.9rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.88rem; }
  .banner.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); border: 1px solid var(--warn); }
  .banner.error { background: color-mix(in srgb, var(--error) 15%, transparent); border: 1px solid var(--error); }
  /* Persistent top-of-page alert: stays put across wizard step re-renders
     (which replace #screen) so the reason the user got bounced here never
     scrolls away. Bright/solid so it reads as a stop-the-line failure. */
  #alert { margin-bottom: 1rem; }
  #alert:empty { display: none; }
  .alert-banner { display: flex; gap: 0.7rem; align-items: flex-start;
    padding: 0.9rem 1rem; border-radius: 10px; color: #fff;
    background: var(--error);
    border: 1px solid color-mix(in srgb, var(--error) 65%, #000);
    box-shadow: 0 2px 12px color-mix(in srgb, var(--error) 45%, transparent); }
  .alert-banner .alert-icon { font-size: 1.4rem; line-height: 1.25; }
  .alert-banner strong { font-size: 0.98rem; }
  .alert-banner .alert-detail { display: block; margin-top: 0.15rem;
    font-size: 0.86rem; opacity: 0.95; }
  .field { margin-bottom: 0.5rem; }
  .field .lbl { display: flex; align-items: center; gap: 0.35rem; }
  .info { cursor: help; color: var(--text-muted); border: 1px solid var(--border); border-radius: 50%;
    width: 15px; height: 15px; font-size: 0.7rem; line-height: 13px; text-align: center; display: inline-block; }
  .group-title { font-weight: 700; margin: 1.25rem 0 0.5rem; font-size: 0.95rem; }
  .restart { color: var(--warn); font-size: 0.72rem; }
  .toplink { font-size: 0.85rem; }
  audio { width: 100%; margin-top: 0.75rem; }
  /* Voice dropdown + play/pause preview button on one row. */
  .voice-row { display: flex; align-items: center; gap: 0.5rem; }
  .voice-row select { flex: 1; }
  .voice-play { flex: none; width: 2.4rem; padding: 0.5rem 0; font-size: 0.85rem;
    line-height: 1; justify-content: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="brand-logo" src="/logo.png" alt="">
    <div>
      <div class="title" id="brand-title">Fulloch</div>
      <div class="sub" id="subtitle">Starting up</div>
    </div>
  </header>

  <div id="alert"></div>
  <div id="steps" class="steps"></div>
  <div id="screen"></div>
</div>

<script>
// ---- token auth (mirrors the dashboard) -----------------------------------
const TOKEN_KEY = 'fulloch_token';
(() => {
  const p = new URLSearchParams(location.search);
  if (p.has('token')) {
    localStorage.setItem(TOKEN_KEY, p.get('token').trim());
    p.delete('token');
    const qs = p.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
  }
})();
const authToken = () => localStorage.getItem(TOKEN_KEY) || '';
const _fetch = window.fetch.bind(window);
window.fetch = (url, opts = {}) => {
  const t = authToken();
  if (t) {
    const h = new Headers(opts.headers || {});
    h.set('Authorization', `Bearer ${t}`);
    opts = { ...opts, headers: h };
  }
  return _fetch(url, opts);
};
const getJSON = (u) => fetch(u).then(r => r.json());
const postJSON = (u, body) => fetch(u, {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body || {}),
});
const putJSON = (u, body) => fetch(u, {
  method: 'PUT', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body || {}),
});

// Kokoro built-in English voices (static; mirrors core/tts_onnx KOKORO_VOICES).
// All 28 render cleanly under the fp32 ONNX model (fp16 NaN'd 11 of them).
// af_heart is the recommended default and listed first.
const KOKORO_RECOMMENDED = 'af_heart';
const KOKORO_VOICES = [
  'af_heart','af_alloy','af_aoede','af_bella','af_jessica','af_kore',
  'af_nicole','af_nova','af_river','af_sarah','af_sky',
  'am_adam','am_echo','am_eric','am_fenrir','am_liam','am_michael',
  'am_onyx','am_puck','am_santa',
  'bf_alice','bf_emma','bf_isabella','bf_lily',
  'bm_daniel','bm_fable','bm_george','bm_lewis',
];
const kokoroOption = (v, selected) =>
  `<option value="${v}"${v === selected ? ' selected' : ''}>` +
  `${v === KOKORO_RECOMMENDED ? v + ' — recommended' : v}</option>`;

const $ = (id) => document.getElementById(id);
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
const screen = () => $('screen');

// Top-of-page red alert shown when the app bounced to setup because the chosen
// configuration failed (bad config.yml, or a backend that couldn't load / ran
// out of memory). Lives outside #screen so wizard step re-renders don't wipe it.
function showAlert(detail) {
  const d = document.createElement('div');  // textContent escapes server detail
  d.className = 'alert-detail';
  d.textContent = detail || 'Please choose a different setup below.';
  $('alert').innerHTML =
    `<div class="alert-banner"><span class="alert-icon" aria-hidden="true">⚠</span>`
    + `<div><strong>This configuration doesn't work on your system.</strong>`
    + `${d.outerHTML}</div></div>`;
}
function clearAlert() { const a = $('alert'); if (a) a.innerHTML = ''; }

let SCHEMA = null, PREFLIGHT = null;
const sel = { tier: 'cpu_local', models: null, wakeword: 'hey atticus', wakeword_pattern: '', voice_clone: '',
              modelPaths: {},   // per-domain custom model paths (asr/tts/llm) set on the install step
              openai: { base_url: '', model: '', api_key: '' } };  // remote-LLM fields (cpu_server tier or custom openai)
let tierChosen = false;  // true once the user explicitly picks a tier (vs the auto recommendation)
let installing = false;  // true once install starts, so the scan stops relabelling the button

const WIZARD_STEPS = ['Tier', 'Wakeword', 'Voice', 'Install', 'Finish'];
let curStep = 0;
// True only when this page session ran the first-run wizard (install kicked off
// in stepInstall). A plain restart reaches the loading screen via boot() with
// this false, so on READY it goes straight to the dashboard rather than the
// post-setup token step (and hides the wizard step breadcrumb).
let cameViaWizard = false;

function renderSteps(activeIdx, mode) {
  const box = $('steps');
  if (mode === 'settings') { box.innerHTML = ''; return; }
  box.innerHTML = '';
  WIZARD_STEPS.forEach((s, i) => {
    const cls = i === activeIdx ? 'active' : (i < activeIdx ? 'done' : '');
    box.appendChild(el(`<span class="s ${cls}">${i + 1}. ${s}</span>`));
  });
}

// ---- entry ----------------------------------------------------------------
async function boot() {
  let status;
  try { status = await getJSON('/status'); }
  catch (e) { screen().innerHTML = `<div class="card">Waiting for server…</div>`; setTimeout(boot, 1500); return; }

  if (status.phase === 'READY') { return openSettings(); }
  if (status.phase === 'DOWNLOADING') { return showProgress(); }
  if (status.phase === 'LOADING') { return showLoading(); }

  // NEEDS_SETUP or ERROR — run the wizard. This is the only path that's an
  // actual first-run/reconfigure (a plain restart routes to LOADING above).
  $('subtitle').textContent = 'First-run setup';
  SCHEMA = await getJSON('/setup/schema');
  try { PREFLIGHT = await getJSON('/setup/preflight'); } catch (e) { PREFLIGHT = null; }
  if (status.phase === 'ERROR') {
    // Persistent alert above the wizard (it survives the step re-renders that
    // replace #screen). Then fall through to the wizard so the user can pick a
    // working setup — covers a bad config.yml and a backend that failed to load
    // (e.g. the chosen model didn't fit in VRAM).
    showAlert(status.detail || 'The current configuration could not start.');
  } else {
    clearAlert();
  }
  // seed selection from any existing config
  const wakeF = SCHEMA.fields.find(f => f.path === 'general.wakeword');
  if (wakeF && wakeF.value) sel.wakeword = wakeF.value;
  stepTier();
}

// ---- step 1: tier ---------------------------------------------------------
function fitFor(tierId) {
  if (!PREFLIGHT) return null;
  return (PREFLIGHT.tier_fit || []).find(t => t.id === tierId);
}

// Recommend the Full (GPU) tier when a GPU is present and it actually fits;
// otherwise fall back to the statically-recommended CPU stack.
function recommendedTierId() {
  const fullFit = fitFor('full');
  const gpu = PREFLIGHT && PREFLIGHT.gpu && PREFLIGHT.gpu.available;
  const fullOffered = (SCHEMA.tier_presets || []).some(t => t.id === 'full' && t.offerable !== false);
  if (gpu && fullOffered && fullFit && fullFit.badge === 'ok') return 'full';
  const staticRec = (SCHEMA.tier_presets || []).find(t => t.recommended);
  return staticRec ? staticRec.id : 'cpu_local';
}

function stepTier() {
  curStep = 0; renderSteps(0);
  // Only tiers this image can actually run (the CPU image hides the GPU tier).
  const tiers = SCHEMA.tier_presets.filter(t => t.offerable !== false);
  const recId = recommendedTierId();
  // Default the selection to the recommendation until the user picks one.
  if (!tierChosen) sel.tier = recId;
  // If a key is already in the environment, say so and don't prompt for one.
  const keyInEnv = SCHEMA && SCHEMA.llm_api_key_in_env;
  const keyPlaceholder = keyInEnv ? 'found in environment — leave blank to use it' : '(blank for local servers)';
  const c = el(`<div class="card"><h2>Choose a tier</h2>
    <p class="lead">Pick a ready-made setup, or configure the backends yourself.</p>
    <div id="tier-list"></div>
    <details class="advanced" id="adv-backends"><summary>Advanced: configure backends individually</summary>
      <div id="backend-cfg"></div></details>
    <div id="openai-form" style="display:none;margin-top:0.75rem">
      <p class="help">This tier runs the language model on a separate OpenAI-compatible server. Point it at yours:</p>
      <label>Server address (base URL)</label><input type="text" id="oai-url" placeholder="http://localhost:8888/v1">
      <label>Model (optional)</label><input type="text" id="oai-model" placeholder="blank for single-model servers; e.g. gpt-4o-mini for OpenAI">
      <label>API key (optional, prefer .env)</label><input type="text" id="oai-key" placeholder="${keyPlaceholder}">
      <div class="actions" style="justify-content:flex-start;gap:0.75rem">
        <button id="oai-test">Test connection</button><span id="oai-status" class="muted"></span></div>
      <div class="help">All optional — blanks use the defaults shown. An unreachable endpoint drops to limited regex-only commands at runtime.</div>
    </div>
    <div class="actions"><span></span><button class="primary next" id="next1">Next</button></div></div>`);
  screen().innerHTML = ''; screen().appendChild(c);

  const list = $('tier-list');
  tiers.forEach(t => {
    const fit = fitFor(t.id);
    const badge = fit ? `<span class="badge ${fit.badge}">${fit.badge === 'ok' ? 'fits' : (fit.reason || 'check')}</span>` : '';
    const rec = t.id === recId ? '<span class="badge rec">recommended</span>' : '';
    const node = el(`<div class="opt ${sel.tier === t.id ? 'sel' : ''}" data-tier="${t.id}">
      <div class="row"><span class="name">${t.label} ${rec}</span>${badge}</div>
      <div class="blurb">${t.blurb}${fit ? ` · ~${fit.download_gb}GB download` : ''}</div></div>`);
    node.addEventListener('click', () => {
      sel.tier = t.id; sel.models = null; tierChosen = true;
      document.querySelectorAll('#tier-list .opt').forEach(o => o.classList.toggle('sel', o.dataset.tier === t.id));
      syncOpenaiForm();  // a tier with an off-device LLM (cpu_server) reveals the fields + character swap
    });
    list.appendChild(node);
  });

  renderBackendCfg();
  // Restore any previously-entered remote-LLM values, then wire the fields.
  $('oai-url').value = sel.openai.base_url;
  $('oai-model').value = sel.openai.model;
  $('oai-key').value = sel.openai.api_key;
  ['oai-url', 'oai-model', 'oai-key'].forEach(id => $(id).addEventListener('input', () => {
    sel.openai.base_url = $('oai-url').value.trim();
    sel.openai.model = $('oai-model').value.trim();
    sel.openai.api_key = $('oai-key').value.trim();
  }));
  $('oai-test').addEventListener('click', async () => {
    const s = $('oai-status'); s.textContent = 'Testing…';
    const r = await postJSON('/setup/test-llm', {
      base_url: sel.openai.base_url || 'http://localhost:8888/v1',
      model: sel.openai.model, api_key: sel.openai.api_key,
    });
    const j = await r.json();
    s.textContent = j.ok ? '✓ reachable' : ('✗ ' + (j.error || 'failed'));
    s.style.color = j.ok ? 'var(--primary)' : 'var(--error)';
  });

  syncOpenaiForm();  // reflect the initially-recommended tier
  $('next1').addEventListener('click', stepWakeword);
}

function renderBackendCfg() {
  const box = $('backend-cfg');
  const b = SCHEMA.backends;
  const mk = (domain, label) => {
    const opts = b[domain].filter(o => o.offerable).map(o => {
      const meta = o.download_size_gb ? ` (~${o.download_size_gb}GB${o.vram_gb ? `, ${o.vram_gb}GB VRAM` : ''})` : '';
      const exp = o.experimental ? ' [experimental]' : '';
      return `<option value="${o.backend}">${o.display_name}${exp}${meta}</option>`;
    }).join('');
    return `<div><label>${label}</label><select id="be-${domain}">${opts}</select></div>`;
  };
  box.innerHTML = `<p class="help">Selecting these overrides the tier above.</p>
    <div class="grid2">${mk('asr','Speech-to-text')}${mk('tts','Text-to-speech')}${mk('llm','Language model')}</div>`;

  // The remote-LLM fields (#openai-form) live in the tier card, shared with the
  // cpu_server tier; chosenModels() folds sel.openai into any openai selection.
  const syncCustom = () => {
    sel.tier = 'custom';
    sel.models = { asr: { backend: $('be-asr').value }, tts: { backend: $('be-tts').value },
                   llm: { backend: $('be-llm').value } };
    document.querySelectorAll('#tier-list .opt').forEach(o => o.classList.remove('sel'));
    syncOpenaiForm();  // show/hide the remote-LLM fields + preview character swap
  };
  ['asr','tts','llm'].forEach(d => $(`be-${d}`).addEventListener('change', syncCustom));
  // Opening the advanced panel commits the *shown* dropdown values as the
  // selection — otherwise leaving a pre-selected default (e.g. ONNX, the first
  // CPU option) wouldn't register without an explicit change, and install would
  // silently fall back to the tier preset.
  const adv = $('adv-backends');
  if (adv) adv.addEventListener('toggle', () => { if (adv.open) syncCustom(); });
}

function chosenModels() {
  let m;
  if (sel.tier === 'custom' && sel.models) m = JSON.parse(JSON.stringify(sel.models));
  else { const t = SCHEMA.tier_presets.find(x => x.id === sel.tier); m = t ? JSON.parse(JSON.stringify(t.models)) : null; }
  // Fold the user-entered remote-LLM fields into any openai selection (tier or
  // custom). Deep-cloned above so we never mutate the cached SCHEMA preset.
  // Blanks are omitted so the backend defaults apply (base_url, single-model).
  if (m && m.llm && m.llm.backend === 'openai') {
    if (sel.openai.base_url) m.llm.base_url = sel.openai.base_url;
    if (sel.openai.model) m.llm.model = sel.openai.model;
    if (sel.openai.api_key) m.llm.api_key = sel.openai.api_key;
  }
  return m;
}
function ttsBackend() { const m = chosenModels(); return m && m.tts ? m.tts.backend : 'qwen'; }

// Show/hide the remote-LLM fields (#openai-form) and preview the remote character whenever the
// effective LLM selection (tier or custom) is openai. Single source for both paths.
function syncOpenaiForm() {
  const m = chosenModels();
  const isOai = !!(m && m.llm && m.llm.backend === 'openai');
  const form = $('openai-form');
  if (form) form.style.display = isOai ? '' : 'none';

// Preview the travelling character live while the user selects an

function setBranding(remote) {

// --- voice preview: a play/pause button bound to a <select>, playing the
// bundled clip at data/voices/<selected>.wav. One clip plays at a time. -----
let _voiceAudio = null, _voiceBtn = null;
function _voiceStop() {
  if (_voiceAudio) { _voiceAudio.pause(); _voiceAudio = null; }
  if (_voiceBtn) { _voiceBtn.textContent = '▶'; _voiceBtn = null; }
}
function makeVoicePreview(selectEl) {
  const btn = el(`<button type="button" class="voice-play" title="Preview voice" aria-label="Preview voice">▶</button>`);
  btn.addEventListener('click', () => {
    const togglingOff = _voiceBtn === btn && _voiceAudio && !_voiceAudio.paused;
    _voiceStop();
    if (togglingOff || !selectEl.value) return;
    // <audio> can't send the Authorization header fetch uses, so pass the token
    // as a query param (the dashboard middleware accepts either).
    const tok = authToken();
    const url = '/voice/sample?name=' + encodeURIComponent(selectEl.value)
      + (tok ? '&token=' + encodeURIComponent(tok) : '');
    const a = new Audio(url);
    _voiceAudio = a; _voiceBtn = btn; btn.textContent = '⏸';
    const reset = () => { if (_voiceBtn === btn) _voiceStop(); };
    a.onended = reset; a.onerror = reset;
    a.play().catch(reset);
  });
  // Changing the selected voice stops playback so the next play uses the new pick.
  selectEl.addEventListener('change', _voiceStop);
  return btn;
}

async function stepVoice() {
  curStep = 2; renderSteps(2);

async function generateVoice() {
  const instruct = $('gv-instruct').value.trim();

// ---- step 4: review + install ---------------------------------------------
// Chosen models with any per-domain custom paths folded in (deep-copied so a
// tier preset object is never mutated).
function chosenModelsWithPaths() {
  const m = JSON.parse(JSON.stringify(chosenModels() || {}));
  Object.entries(sel.modelPaths || {}).forEach(([domain, path]) => {
    if (path && m[domain]) m[domain].model = path;
  });
  return m;
}

function stepReview() {
  curStep = 3; renderSteps(3);
  const models = chosenModels();
  const c = el(`<div class="card"><h2>Ready to install</h2>
    <p class="lead">Review your choices. We'll only download what isn't already on disk.</p>
    <ul class="muted">
      <li>Tier / backends: <b>${sel.tier === 'custom' ? `${models.asr.backend} · ${models.tts.backend} · ${models.llm.backend}` : sel.tier}</b></li>
      <li>Wakeword: <b>${sel.wakeword}</b></li>
      <li>Voice: <b>${sel.voice_clone || '(default)'}</b></li>
    </ul>
    <h3 style="margin:1rem 0 0.5rem">Models</h3>
    <div id="model-scan"><p class="muted">Scanning for models already on disk…</p></div>
    <div class="actions"><button id="back4" class="back">Back</button><button class="primary" id="install-btn">Download &amp; install</button></div></div>`);
  screen().innerHTML = ''; screen().appendChild(c);
  $('back4').addEventListener('click', stepVoice);
  $('install-btn').addEventListener('click', doInstall);

// Pre-scan: ask the server which models are already present vs need downloading,
// and offer a custom-path input per model so the user can point at one they
// already have (loaded from there, no re-download).
async function refreshScan() {
  const box = $('model-scan');
  if (!box) return;
  const assets = await fetchPlan();
  if (assets === null) { box.innerHTML = '<p class="muted">Couldn\'t scan — install will download whatever is missing.</p>'; return; }

  // Build the structure ONCE (stable ids); presence/badges/button are patched in
  // place by applyScan so a path input keeps focus + value while the user types.
  box.innerHTML = '';
  assets.forEach(a => {
    box.appendChild(el(`<div class="asset"><div style="min-width:12rem">${a.label}</div>
      <div class="st" id="scan-badge-${cssId(a.key)}"></div></div>`));
    // Custom-path input for the three main model domains only (not BGE/grammar).
    if (a.domain && ['asr', 'tts', 'llm'].includes(a.domain)) {
      const cur = (sel.modelPaths && sel.modelPaths[a.domain]) || '';
      const isFile = a.kind === 'file';
      const ph = isFile ? '/abs/path/to/model.gguf' : '/abs/path/to/model-folder';
      box.appendChild(el(`<details class="advanced"${cur ? ' open' : ''}><summary>Use a model I already have</summary>
        <label>Path to the ${a.domain.toUpperCase()} model ${isFile ? 'file (.gguf)' : 'folder'}</label>
        <input type="text" class="model-path" data-domain="${a.domain}" placeholder="${ph}" value="${cur.replace(/"/g, '&quot;')}">
        <div class="pathstatus" id="scan-path-${a.domain}" style="font-size:0.8rem;margin:0.3rem 0"></div>
        <div class="help">Absolute path to a model already on disk — loads from there, no download. ${isFile ? 'Point at the .gguf <b>file</b> itself, not its folder. ' : ''}Must be readable by Fulloch (in Docker, under a mounted volume). Blank = download the default.</div></details>`));
    }
  });
  box.appendChild(el('<p class="muted" id="scan-summary" style="margin-top:0.5rem"></p>'));

  // Live validation: re-check as the user types (debounced) and instantly on
  // blur/enter — applyScan patches in place, so focus + value are never lost.
  let deb;
  box.querySelectorAll('.model-path').forEach(inp => {
    inp.addEventListener('input', () => { syncModelPaths(); clearTimeout(deb); deb = setTimeout(updateScan, 400); });
    inp.addEventListener('change', () => { syncModelPaths(); clearTimeout(deb); updateScan(); });
  });
  applyScan(assets);
}

function cssId(key) { return String(key).replace(/[^a-z0-9]/gi, '-'); }

// Wrong *kind* of path for a domain: the local LLM wants a .gguf file; the
// speech models want a folder. Catches e.g. dropping a .gguf into the TTS slot.
const _WEIGHT_FILE_RE = /\.(gguf|bin|safetensors)$/i;
function pathTypeWarning(domain, path) {
  if (!path) return '';
  const isWeightFile = _WEIGHT_FILE_RE.test(path);
  if (domain === 'llm' && !isWeightFile) return 'The local language model needs a .gguf file, not a folder.';
  if ((domain === 'asr' || domain === 'tts') && isWeightFile) return 'Speech models need a model folder, not a single .gguf/.bin file.';
  return '';
}

// Any custom path that's the wrong kind for its model — install is blocked until
// these are fixed so a broken config isn't saved.
function modelPathIssues() {
  return Object.entries(sel.modelPaths || {})
    .map(([domain, path]) => pathTypeWarning(domain, path))
    .filter(Boolean);
}

async function fetchPlan() {
  try {
    const r = await postJSON('/setup/plan', { models: chosenModelsWithPaths() });
    if (!r.ok) return null;
    return (await r.json()).assets || [];
  } catch (e) { return null; }
}

// Re-fetch presence and patch badges / per-path status / the install button in
// place (no rebuild) — immediate feedback while a path is being typed.
async function updateScan() {
  const assets = await fetchPlan();
  if (assets) applyScan(assets);
}

function applyScan(assets) {
  let allPresent = true;
  assets.forEach(a => {
    if (!a.present) allPresent = false;
    const customPath = (sel.modelPaths && sel.modelPaths[a.domain]) || '';
    const badge = $('scan-badge-' + cssId(a.key));
    if (badge) {
      if (a.present) badge.innerHTML = '<span class="badge ok">on disk</span>';
      else if (customPath) badge.innerHTML = '<span class="badge warn">can\'t reach path</span>';
      else badge.innerHTML = `<span class="badge warn">download ~${a.size_gb != null ? a.size_gb + 'GB' : '?'}</span>`;
    }
    if (a.domain) {
      const ps = $('scan-path-' + a.domain);
      if (ps) {
        const typeWarn = pathTypeWarning(a.domain, customPath);
        if (typeWarn) { ps.textContent = '✗ ' + typeWarn; ps.style.color = 'var(--error)'; }
        else if (customPath && a.present) { ps.textContent = '✓ found — will load from here, no download'; ps.style.color = 'var(--primary)'; }
        else if (customPath) { ps.textContent = '✗ Fulloch can\'t reach that location — check the path (in Docker it must be under a mounted volume)'; ps.style.color = 'var(--error)'; }
        else { ps.textContent = ''; }
      }
    }
  });
  const summary = $('scan-summary');
  if (summary) summary.textContent = allPresent ? 'All models are already on disk — nothing to download.' : '';
  // Rename the action when there's nothing left to fetch; a wrong-kind path
  // blocks install (the red warnings above say what to fix).
  const issues = modelPathIssues();
  const btn = $('install-btn');
  if (btn && !installing) {
    btn.disabled = issues.length > 0;
    btn.textContent = issues.length ? 'Fix the model paths above' : (allPresent ? 'Finish setup' : 'Download & install');
  }
}

// Read the custom-path inputs straight from the DOM into sel.modelPaths. Called
// before install too, so a path typed but not blurred (no 'change' fired) is
// still captured — otherwise the default would download despite a path entered.
function syncModelPaths() {
  sel.modelPaths = sel.modelPaths || {};
  document.querySelectorAll('#model-scan .model-path').forEach(inp => {
    sel.modelPaths[inp.dataset.domain] = inp.value.trim();
  });
}

async function doInstall() {
  syncModelPaths();  // capture any path typed but not yet blurred
  const issues = modelPathIssues();
  if (issues.length) { updateScan(); return; }  // wrong-kind path -> don't save a broken config
  installing = true;
  $('install-btn').disabled = true;
  const models = chosenModelsWithPaths();
  // 1. write the models block, 2. write config (wakeword/voice), 3. start download
  await postJSON('/setup/models', { models });
  const updates = {
    'general.wakeword': sel.wakeword,
    'general.wakeword_pattern': sel.wakeword_pattern || '',
    'general.voice_clone': sel.voice_clone || '',
  };
  await putJSON('/config', { updates });
  const r = await postJSON('/setup/install');
  if (!r.ok) { const e = await r.json().catch(() => ({})); alert('Install failed: ' + (e.detail || r.status)); $('install-btn').disabled = false; return; }
  cameViaWizard = true;
  showProgress();
}

// ---- download progress ----------------------------------------------------
function showProgress() {
  curStep = 3; renderSteps(3);
  clearAlert();  // a fresh reconfigure is underway — drop any prior failure alert
  screen().innerHTML = `<div class="card"><h2>Downloading models</h2>
    <p class="lead">Pulling model weights. You can leave this page open.</p>
    <div id="assets"></div><div id="dl-error"></div></div>`;
  pollProgress();
}

async function pollProgress() {
  let snap;
  try { snap = await getJSON('/setup/progress'); } catch (e) { setTimeout(pollProgress, 1500); return; }
  const box = $('assets');
  box.innerHTML = '';
  (snap.assets || []).forEach(a => {
    const pct = a.status === 'done' ? 100 : (a.status === 'downloading' ? 60 : 0);
    box.appendChild(el(`<div class="asset"><div style="min-width:9rem">${a.label}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="st">${a.status}</div></div>`));
  });
  if (snap.state === 'error') {
    $('dl-error').innerHTML = `<div class="banner error">${snap.error || 'Download failed.'} — fix the issue and reload to retry.</div>`;
    return;
  }
  if (snap.state === 'done') { return showLoading(); }
  setTimeout(pollProgress, 1200);
}

// ---- loading (models loading into memory) ---------------------------------
let loadSeenSeq = 0;  // highest log seq rendered into the terminal so far

function showLoading() {
  curStep = 4;
  loadSeenSeq = 0;
  clearAlert();  // a fresh load attempt is underway — drop any prior failure alert
  // Only call it "First-run setup" when this session actually ran the wizard;
  // a plain restart that's just reloading models is "Starting up".
  $('subtitle').textContent = cameViaWizard ? 'First-run setup' : 'Starting up';
  // On a plain restart (not the first-run wizard) there are no wizard steps to
  // show — clear the breadcrumb so it reads as a simple "starting up" screen.
  renderSteps(4, cameViaWizard ? undefined : 'settings');
  screen().innerHTML = `<div class="card"><h2>Starting up</h2>
    <p class="lead">Loading models and warming up the voice — the assistant will greet you when it's ready.</p>
    <div id="term" class="term" aria-live="polite"></div>
    <div class="term-foot"><span class="spinner sm"></span><span class="muted" id="load-detail"></span></div></div>`;
  pollLoading();
}

// Append any log lines we haven't shown yet, newest last. Multiple new lines in
// one poll cascade in (staggered animation delay) so they read as a stream
// rather than a block. Old nodes are pruned — the panel only shows the tail.
function streamLogLines(log) {
  const term = $('term');
  if (!term || !Array.isArray(log)) return;
  const fresh = log.filter(it => it.seq > loadSeenSeq);
  fresh.forEach((it, i) => {
    const div = document.createElement('div');
    const lvl = it.level === 'WARNING' ? ' warn'
      : (it.level === 'ERROR' || it.level === 'CRITICAL') ? ' error' : '';
    div.className = 'term-line' + lvl;
    div.style.animationDelay = (i * 90) + 'ms';
    div.textContent = it.text;
    term.appendChild(div);
    loadSeenSeq = Math.max(loadSeenSeq, it.seq);
  });
  while (term.children.length > 40) term.removeChild(term.firstChild);
}

async function pollLoading() {
  let s;
  try { s = await getJSON('/status'); } catch (e) { setTimeout(pollLoading, 1200); return; }
  streamLogLines(s.log);
  $('load-detail') && ($('load-detail').textContent = s.detail || '');
  // READY = models loaded AND the greeting has finished. First-run shows the
  // optional token step; a plain restart hands straight to the dashboard (now
  // served at '/').
  if (s.phase === 'READY') { return cameViaWizard ? stepToken() : (location.href = '/'); }
  if (s.phase === 'ERROR') {
    // Models failed to load (or the running assistant crashed). Re-enter via
    // boot(): it shows the red alert with this detail and drops into the wizard
    // so the user can choose a working setup, rather than a dead-end banner.
    return boot();
  }
  setTimeout(pollLoading, 900);
}

// ---- token step -----------------------------------------------------------
function stepToken() {
  curStep = 4; renderSteps(4);
  const c = el(`<div class="card"><h2>You're all set 🎉</h2>
    <p class="lead">Optionally protect the dashboard &amp; settings with an access token (recommended if it's reachable on your network).</p>
    <div class="actions" style="justify-content:flex-start;gap:0.75rem">
      <button class="primary" id="gen-token">Generate access token</button>
      <button id="skip-token">Continue without one</button></div>
    <div id="token-out"></div></div>`);
  screen().innerHTML = ''; screen().appendChild(c);
  $('skip-token').addEventListener('click', () => location.href = '/');
  $('gen-token').addEventListener('click', async () => {
    $('gen-token').disabled = true;
    const r = await postJSON('/setup/token');
    if (!r.ok) { alert('Could not generate token.'); $('gen-token').disabled = false; return; }
    const { token } = await r.json();
    localStorage.setItem(TOKEN_KEY, token);
    $('token-out').innerHTML = `<p style="margin-top:1rem"><b>Copy this token now — it won't be shown again:</b></p>
      <div class="token-box" id="tok">${token}</div>
      <div class="actions" style="justify-content:flex-start;gap:0.75rem">
        <button id="copy-tok">Copy</button>
        <button class="primary" id="go-dash">I've saved it — go to dashboard</button></div>`;
    $('copy-tok').addEventListener('click', () => navigator.clipboard?.writeText(token));
    $('go-dash').addEventListener('click', () => location.href = '/?token=' + encodeURIComponent(token));
  });
}

// ---- settings console (post-setup) ----------------------------------------
async function openSettings() {
  renderSteps(0, 'settings');
  $('subtitle').textContent = 'Settings';
  SCHEMA = await getJSON('/setup/schema');
  screen().innerHTML = '';

  // Sticky top bar: clear way back to the dashboard.
  const bar = el(`<div class="topbar">
    <button class="back" id="settings-back">Back to dashboard</button>
    <span class="spacer"></span><h2>Settings</h2></div>`);
  screen().appendChild(bar);
  $('settings-back').addEventListener('click', () => location.href = '/');

  // Models card first (speech + language backends).
  screen().appendChild(modelsCard());
  wireModelsCard();

  // Full config console.
  const byGroup = {};
  SCHEMA.fields.forEach(f => { (byGroup[f.group] = byGroup[f.group] || []).push(f); });
  const c = el(`<div class="card"><h2>Configuration</h2>
    <p class="lead">Every <code>config.yml</code> value is editable here. Hover the <span class="info">i</span> on any field for help. Restart-flagged changes need a restart.</p>
    <div id="cfg-form"></div>
    <div id="save-note"></div>
    <div class="actions"><button class="back" id="cfg-back">Back to dashboard</button><button class="primary" id="save-cfg">Save changes</button></div>
    </div>`);
  screen().appendChild(c);
  $('cfg-back').addEventListener('click', () => location.href = '/');
  const form = $('cfg-form');
  SCHEMA.groups.forEach(g => {
    if (!byGroup[g]) return;
    form.appendChild(el(`<div class="group-title">${g}</div>`));
    byGroup[g].forEach(f => { const n = fieldRow(f); if (n) form.appendChild(n); });
  });
  $('save-cfg').addEventListener('click', saveSettings);
  // Snapshot the rendered values so saveSettings can send only what changed —
  // otherwise every save re-sends the restart-only fields too and would always
  // report "restart required", masking hot-applied changes.
  CFG_INITIAL = {};
  document.querySelectorAll('#cfg-form [data-path]').forEach(node => {
    CFG_INITIAL[node.dataset.path] = node.dataset.ghost === '1' ? '' : node.value;
  });
  populateVoiceField();

  // Re-run setup (bottom of the page). Keeps downloaded models; a full wipe is
  // deleting the data volume.
  const dz = el(`<div class="card">
    <h2>Re-run setup</h2>
    <p class="lead">Start the setup wizard again — re-pick tier, models, wakeword and voice. Your current <code>config.yml</code> is backed up first and downloaded models are kept (switching backends only fetches what's new). Takes effect after a restart.</p>
    <div id="reset-note"></div>
    <div class="actions"><span></span><button class="danger" id="reset-setup">Re-run setup wizard…</button></div>
    </div>`);
  screen().appendChild(dz);
  $('reset-setup').addEventListener('click', resetSetup);
}

async function resetSetup() {
  if (!confirm('Re-run the setup wizard?\n\nYour config is backed up and downloaded models are kept. Fulloch must restart to apply.')) return;
  const note = $('reset-note');
  const r = await postJSON('/setup/reset');
  if (!r.ok) {
    note.innerHTML = `<div class="banner error">Reset failed: ${r.status}</div>`;
    return;
  }
  const d = await r.json();
  // Offer the same "Restart now" button as the config/model save notifications
  // (unique id so it can't collide with do-restart / do-restart-models). The
  // restart re-enters the wizard via the .setup_pending marker.
  note.innerHTML = `<div class="banner warn">Setup reset armed${d.backup ? ` — config backed up to <code>${d.backup}</code>` : ''}. <b>Restart Fulloch</b> to run the wizard.
    <button id="do-restart-reset" class="primary" style="margin-left:0.5rem;padding:0.3rem 0.8rem">Restart now</button></div>`;
  $('do-restart-reset').addEventListener('click', doRestart);
}

// Fill the Qwen "Voice model" dropdown with the available data/voices clones.
async function populateVoiceField() {
  const sel = document.querySelector('#cfg-form select[data-voices="qwen"]');
  if (!sel) return;
  const cur = sel.value;
  try {
    const { voices } = await getJSON('/setup/voices');
    const list = (voices && voices.length) ? voices.slice() : [];
    if (cur && !list.includes(cur)) list.unshift(cur);
    if (list.length) {
      sel.innerHTML = list.map(v =>
        `<option value="${v}"${v === cur ? ' selected' : ''}>${v}</option>`).join('');
    }
  } catch (e) { /* keep the current value as the sole option */ }
}

function currentBackend(domain) {
  const m = SCHEMA.models;
  if (m && m[domain] && m[domain].backend) return m[domain].backend;
  // Fall back to the first offerable backend for this image.
  const off = (SCHEMA.backends[domain] || []).filter(o => o.offerable);
  return off.length ? off[0].backend : '';
}

const DEFAULT_LLAMA_FILE = 'Qwen3.5-9B-UD-Q4_K_XL.gguf';
// Rendered settings values, snapshotted so saveSettings sends only what changed.
let CFG_INITIAL = {};

function modelsCard() {
  const b = SCHEMA.backends;
  const llm = (SCHEMA.models && SCHEMA.models.llm) || {};
  // Pre-select "Custom" only when a non-default local model path is configured.
  const llamaCustom = llm.backend === 'llama' && llm.model &&
    !String(llm.model).endsWith(DEFAULT_LLAMA_FILE);
  const llamaPath = llamaCustom ? String(llm.model) : '';
  const llamaCtx = (llm.backend === 'llama' && llm.n_context) ? llm.n_context : '';
  // Custom local paths for the speech models (set -> load from there instead of
  // the default download). Only present in config when the user set one.
  const asrPath = String(((SCHEMA.models && SCHEMA.models.asr) || {}).model || '');
  const ttsPath = String(((SCHEMA.models && SCHEMA.models.tts) || {}).model || '');
  const optsFor = (domain) => {
    const cur = currentBackend(domain);
    return b[domain].filter(o => o.offerable).map(o =>
      `<option value="${o.backend}"${o.backend === cur ? ' selected' : ''}>${o.display_name}</option>`
    ).join('');
  };
  return el(`<div class="card"><h2>Models</h2>
    <p class="lead">Speech + language backends. <b>Model changes take effect after a restart.</b></p>
    <div class="grid2">
      <div><label>Speech-to-text</label><select id="sm-asr">${optsFor('asr')}</select></div>
      <div><label>Text-to-speech</label><select id="sm-tts">${optsFor('tts')}</select></div>
      <div><label>Language model</label><select id="sm-llm">${optsFor('llm')}</select></div>
    </div>
    <details class="advanced" id="sm-asr-custom"${asrPath ? ' open' : ''}>
      <summary>Speech-to-text: use a model I already have</summary>
      <label>Path to the ASR model folder</label>
      <input type="text" id="sm-asr-model" placeholder="/abs/path/asr-model-dir  (or ./data/models/x)" value="${asrPath.replace(/"/g,'&quot;')}">
      <div class="help">Load an ASR model already on disk from here instead of the default. Blank = default.</div>
    </details>
    <details class="advanced" id="sm-tts-custom"${ttsPath ? ' open' : ''}>
      <summary>Text-to-speech: use a model I already have</summary>
      <label>Path to the TTS model folder</label>
      <input type="text" id="sm-tts-model" placeholder="/abs/path/tts-model-dir  (or ./data/models/x)" value="${ttsPath.replace(/"/g,'&quot;')}">
      <div class="help">Load a TTS model already on disk from here instead of the default. Blank = default.</div>
    </details>
    <div id="sm-openai" style="display:none;margin-top:0.75rem">
      <label>Base URL</label><input type="text" id="sm-oai-url" placeholder="http://localhost:8888/v1" value="${(llm.backend === 'openai' ? llm.base_url || '' : '').replace(/"/g,'&quot;')}">
      <label>Model (optional)</label><input type="text" id="sm-oai-model" placeholder="blank for single-model servers; e.g. gpt-4o-mini for OpenAI" value="${(llm.backend === 'openai' ? llm.model || '' : '').replace(/"/g,'&quot;')}">
      <label>API key (optional, prefer .env)</label><input type="text" id="sm-oai-key" placeholder="${SCHEMA.llm_api_key_in_env ? 'found in environment — leave blank to use it' : '(blank for local servers)'}">
      <div class="actions" style="justify-content:flex-start;gap:0.75rem">
        <button id="sm-oai-test">Test connection</button><span id="sm-oai-status" class="muted"></span></div>
      <div id="sm-oai-models" style="display:none;margin-top:0.5rem">
        <label>Available models</label>
        <div class="actions" style="justify-content:flex-start;gap:0.5rem">
          <select id="sm-oai-model-list" style="flex:1"></select>
          <button id="sm-oai-apply">Apply live</button><span id="sm-oai-apply-status" class="muted"></span>
        </div>
        <div class="help">Switches the running model instantly — no restart — and saves it. Picking one also fills the box above.</div>
      </div>
      <div class="help">An unreachable endpoint drops to limited regex-only commands at runtime.</div>
    </div>
    <div id="sm-llama" style="display:none;margin-top:0.75rem">
      <label>Model</label>
      <select id="sm-llama-sel">
        <option value="default"${llamaCustom ? '' : ' selected'}>Default — Qwen3.5-9B-UD-Q4_K_XL (downloaded automatically)</option>
        <option value="custom"${llamaCustom ? ' selected' : ''}>Custom .gguf file…</option>
      </select>
      <div id="sm-llama-custom" style="display:none;margin-top:0.5rem">
        <label>Path to .gguf file</label>
        <input type="text" id="sm-llama-model" placeholder="/abs/path/model.gguf  (or ./data/models/x.gguf)" value="${llamaPath.replace(/"/g,'&quot;')}">
        <div class="help">Use a .gguf you already have to skip re-downloading. In Docker, a path outside ./data must be mounted into the container.</div>
      </div>
      <label>Context size (tokens)</label>
      <input type="number" id="sm-llama-ctx" placeholder="12288" value="${llamaCtx}">
      <div class="help">Larger context uses more VRAM — 16384 may OOM on a 16GB card.</div>
    </div>
    <div id="models-note"></div>
    <div class="actions"><span></span><button class="primary" id="save-models">Save models</button></div>
    </div>`);
}

function wireModelsCard() {
  const toggleLlm = () => {
    const v = $('sm-llm').value;
    $('sm-openai').style.display = v === 'openai' ? '' : 'none';
    $('sm-llama').style.display = v === 'llama' ? '' : 'none';
    setBranding(v === 'openai');  // preview travelling character on an off-device LLM
  };
  $('sm-llm').addEventListener('change', toggleLlm);
  toggleLlm();
  const toggleLlamaCustom = () => {
    $('sm-llama-custom').style.display = $('sm-llama-sel').value === 'custom' ? '' : 'none';
  };
  $('sm-llama-sel').addEventListener('change', toggleLlamaCustom);
  toggleLlamaCustom();
  $('sm-oai-test').addEventListener('click', async () => {
    const s = $('sm-oai-status'); s.textContent = 'Testing…';
    const r = await postJSON('/setup/test-llm', {
      base_url: $('sm-oai-url').value.trim(), model: $('sm-oai-model').value.trim(),
      api_key: $('sm-oai-key').value.trim(),
    });
    const j = await r.json();
    s.textContent = j.ok ? '✓ reachable' : ('✗ ' + (j.error || 'failed'));
    s.style.color = j.ok ? 'var(--primary)' : 'var(--error)';
    if (j.ok) fetchOaiModels();  // offer a picker once we know it's reachable
  });
  // Pick from the list -> fill the model box (so Save uses the same value).
  $('sm-oai-model-list').addEventListener('change', () => {
    $('sm-oai-model').value = $('sm-oai-model-list').value;
  });
  $('sm-oai-apply').addEventListener('click', async () => {
    const model = $('sm-oai-model-list').value;
    if (!model) return;
    const s = $('sm-oai-apply-status'); s.textContent = 'Switching…'; s.style.color = '';
    const r = await postJSON('/llm/model', { model });
    const j = await r.json().catch(() => ({}));
    if (j.ok) {
      $('sm-oai-model').value = model;
      s.textContent = '✓ now using ' + model + (j.persist_error ? ' (not saved)' : '');
      s.style.color = 'var(--primary)';
    } else {
      s.textContent = '✗ ' + (j.error || 'failed');
      s.style.color = 'var(--error)';
    }
  });
  // If we're already pointed at an OpenAI endpoint, populate the picker on load.
  if ($('sm-llm').value === 'openai' && $('sm-oai-url').value.trim()) fetchOaiModels();
  $('save-models').addEventListener('click', saveModels);
}

async function fetchOaiModels() {
  const url = $('sm-oai-url').value.trim();
  if (!url) return;
  const box = $('sm-oai-models');
  const r = await postJSON('/setup/list-llm-models', {
    base_url: url, api_key: $('sm-oai-key').value.trim(),
  });
  const j = await r.json().catch(() => ({}));
  const models = (j && j.models) || [];
  if (!j.ok || !models.length) { box.style.display = 'none'; return; }  // fall back to manual entry
  const cur = $('sm-oai-model').value.trim();
  $('sm-oai-model-list').innerHTML = models.map(m => {
    const e = m.replace(/"/g, '&quot;');
    return `<option value="${e}"${m === cur ? ' selected' : ''}>${e}</option>`;
  }).join('');
  box.style.display = '';
}

async function saveModels() {
  const llmBackend = $('sm-llm').value;
  const llm = { backend: llmBackend };
  if (llmBackend === 'openai') {
    const model = $('sm-oai-model').value.trim();
    if (model) llm.model = model;  // blank → server's default (single-model servers ignore it)
    llm.base_url = $('sm-oai-url').value.trim();
    const key = $('sm-oai-key').value.trim();
    if (key) llm.api_key = key;
    if (!llm.base_url) {
      $('models-note').innerHTML = `<div class="banner error">OpenAI needs a base URL.</div>`;
      return;
    }
  } else if (llmBackend === 'llama') {
    if ($('sm-llama-sel').value === 'custom') {
      const m = $('sm-llama-model').value.trim();
      if (!m) {
        $('models-note').innerHTML = `<div class="banner error">Enter the path to your .gguf file, or pick Default.</div>`;
        return;
      }
      if (!m.toLowerCase().endsWith('.gguf')) {
        $('models-note').innerHTML = `<div class="banner error">That doesn't look like a .gguf model file.</div>`;
        return;
      }
      llm.model = m;
    }  // else: omit model -> registry default download
    const ctx = $('sm-llama-ctx').value.trim();
    if (ctx) llm.n_context = parseInt(ctx, 10);  // blank = default 12288
  }
  const models = { asr: { backend: $('sm-asr').value }, tts: { backend: $('sm-tts').value }, llm };
  // Custom local model paths (load from there instead of the default download).
  const asrModel = $('sm-asr-model').value.trim();
  const ttsModel = $('sm-tts-model').value.trim();
  if (asrModel) models.asr.model = asrModel;
  if (ttsModel) models.tts.model = ttsModel;
  const r = await postJSON('/setup/models', { models });
  const note = $('models-note');
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    note.innerHTML = `<div class="banner error">Save failed: ${JSON.stringify(e.detail || r.status)}</div>`;
    return;
  }
  SCHEMA.models = models;
  // Model changes always need a restart — offer the same "Restart now" button
  // the bottom config save shows, rather than only telling the user to run
  // docker restart by hand. (Unique id so it can't collide with do-restart.)
  note.innerHTML = `<div class="banner warn">Saved to config.yml. <b>Restart Fulloch</b> for the model change to take effect. If you switched to a backend whose model isn't downloaded yet, the restart re-opens the setup wizard to fetch it.
    <button id="do-restart-models" class="primary" style="margin-left:0.5rem;padding:0.3rem 0.8rem">Restart now</button></div>`;
  $('do-restart-models').addEventListener('click', doRestart);
}

// Mirror core/assistant.py:_build_wakeword_pattern (s/z swap + \W+ join, word
// boundaries) so the console can preview the pattern Fulloch will auto-build for
// a wakeword. A wakeword that matches a shipped preset shows that preset's
// hand-tuned pattern instead.
function autoWakePattern(wakeword) {
  const wk = String(wakeword || '').trim();
  if (!wk) return '';
  const preset = (SCHEMA.wakeword_presets || []).find(
    p => p.wakeword.toLowerCase() === wk.toLowerCase());
  if (preset) return preset.pattern;
  const tolerant = w => Array.from(w).map(
    c => (c === 's' || c === 'z') ? '[sz]' : c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('');
  const tokens = wk.split(/\s+/).filter(Boolean).map(tolerant);
  return '\\b' + tokens.join('\\W+') + '\\b';
}

function fieldRow(f) {
  // Speech rate is Kokoro-only — Qwen TTS has no speed knob, so hide the field
  // entirely when a Qwen voice is selected (returning null; the caller skips it).
  if (f.path === 'general.tts_speed' && currentBackend('tts') !== 'kokoro-onnx') return null;
  const id = 'cf-' + f.path.replace(/\W/g, '_');
  // voice_clone is hot-applied on Kokoro (instant swap) but restart-only on Qwen
  // (clone warmup + cache re-render), so its restart tag is backend-aware.
  let needsRestart = f.apply === 'restart';
  if (f.path === 'general.voice_clone' && currentBackend('tts') === 'kokoro-onnx') needsRestart = false;
  const restart = needsRestart ? '<span class="restart">restart</span>' : '';
  // Default value, shown as a grey placeholder in empty boxes and appended to the
  // (i) hover. null/None defaults (optional fields) contribute neither.
  const defRaw = (f.default === null || f.default === undefined) ? ''
    : (Array.isArray(f.default) ? f.default.join(', ') : String(f.default));
  const titleAttr = ((f.help || '') + (defRaw !== '' ? ` (default: ${defRaw})` : '')).replace(/"/g, '&quot;');
  const defPh = defRaw !== '' ? ` placeholder="${defRaw.replace(/"/g, '&quot;')}"` : '';
  let input;
  const val = f.value === null || f.value === undefined ? '' : f.value;
  // The wakeword pattern is optional: blank in config means "auto-build from the
  // wakeword". Show that auto-built pattern as a grey *placeholder* (an empty box
  // = use the default); the moment the user types a value it's saved as a real
  // override. Emptying the box again reverts to auto.
  if (f.path === 'general.wakeword_pattern') {
    const wkInput = document.getElementById('cf-general_wakeword');
    const wkF = (SCHEMA.fields || []).find(x => x.path === 'general.wakeword');
    const wkVal = wkInput ? wkInput.value : ((wkF && wkF.value) || '');
    const override = String(val);
    const node = el(`<div class="field"><div class="lbl"><label style="margin:0">${f.name}</label>
      <span class="info" title="${titleAttr}">i</span> ${restart}</div>
      <input type="text" id="${id}" data-path="${f.path}" data-type="str"
        value="${override.replace(/"/g,'&quot;')}" placeholder="${autoWakePattern(wkVal).replace(/"/g,'&quot;')}"></div>`);
    const inp = node.querySelector('input');
    // ghost = "still on the auto-built default" = the box is empty. saveSettings
    // sends '' for a ghosted field so it keeps auto-building, not the preview.
    inp.dataset.ghost = override === '' ? '1' : '0';
    inp.addEventListener('input', () => { inp.dataset.ghost = inp.value === '' ? '1' : '0'; });
    // Keep the placeholder preview in sync as the wakeword changes (renders first).
    if (wkInput) wkInput.addEventListener('input', () => {
      inp.placeholder = autoWakePattern(wkInput.value);
    });
    return node;
  }
  // The voice is a backend-aware "Voice model" dropdown: Kokoro's built-in
  // voices, or (for Qwen TTS) the available data/voices clones. The Qwen list
  // is filled in async after render (see populateVoiceField).
  if (f.path === 'general.voice_clone') {
    const cur = String(val);
    let opts;
    if (currentBackend('tts') === 'kokoro-onnx') {
      const list = KOKORO_VOICES.includes(cur) ? KOKORO_VOICES : [cur, ...KOKORO_VOICES].filter(Boolean);
      opts = list.map(v => kokoroOption(v, cur)).join('');
    } else {
      opts = `<option value="${cur.replace(/"/g,'&quot;')}" selected>${cur || '(default)'}</option>`;
    }
    const node = el(`<div class="field"><div class="lbl"><label style="margin:0">Voice model</label>
      <span class="info" title="${titleAttr}">i</span> ${restart}</div>
      <div class="voice-row"><select id="${id}" data-path="${f.path}" data-type="str"${currentBackend('tts') === 'kokoro-onnx' ? '' : ' data-voices="qwen"'}>${opts}</select></div></div>`);
    node.querySelector('.voice-row').appendChild(makeVoicePreview(node.querySelector('select')));
    return node;
  }
  if (f.type === 'bool') {
    input = `<select id="${id}" data-path="${f.path}" data-type="bool">
      <option value="true"${val === true ? ' selected' : ''}>true</option>
      <option value="false"${val === false ? ' selected' : ''}>false</option></select>`;
  } else if (f.type === 'enum') {
    input = `<select id="${id}" data-path="${f.path}" data-type="enum">${
      f.choices.map(ch => `<option value="${ch}"${ch === val ? ' selected' : ''}>${ch}</option>`).join('')}</select>`;
  } else if (f.type === 'list') {
    const txt = Array.isArray(val) ? val.join(', ') : val;
    const ph = defRaw !== '' ? defRaw.replace(/"/g, '&quot;') : 'comma-separated';
    input = `<input type="text" id="${id}" data-path="${f.path}" data-type="list" value="${String(txt).replace(/"/g,'&quot;')}" placeholder="${ph}">`;
  } else {
    const t = (f.type === 'int' || f.type === 'float') ? 'number' : 'text';
    // Prefer the default as the placeholder; fall back to the .env hint for secrets.
    const ph = defPh || (f.secret ? ' placeholder="(prefer .env)"' : '');
    input = `<input type="${t}" id="${id}" data-path="${f.path}" data-type="${f.type}" value="${String(val).replace(/"/g,'&quot;')}"${ph}>`;
  }
  return el(`<div class="field"><div class="lbl"><label style="margin:0">${f.name}</label>
    <span class="info" title="${titleAttr}">i</span> ${restart}</div>${input}</div>`);
}

async function saveSettings() {
  const updates = {};
  document.querySelectorAll('#cfg-form [data-path]').forEach(node => {
    // A still-ghosted field (auto-generated preview, never edited) saves blank so
    // it keeps auto-building rather than freezing the previewed value.
    const v = node.dataset.ghost === '1' ? '' : node.value;
    // Only send changed fields: re-sending the restart-only fields unchanged
    // would always trip restart_required and hide hot-applied changes.
    if (!(node.dataset.path in CFG_INITIAL) || v !== CFG_INITIAL[node.dataset.path]) {
      updates[node.dataset.path] = v;
    }
  });
  const note = $('save-note');
  if (Object.keys(updates).length === 0) {
    note.innerHTML = `<div class="banner" style="border:1px solid var(--primary);color:var(--primary)">No changes to save.</div>`;
    return;
  }
  const r = await putJSON('/config', { updates });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    note.innerHTML = `<div class="banner error">Save failed: ${JSON.stringify(e.detail || r.status)}</div>`;
    return;
  }
  const { restart_required } = await r.json();
  // Re-baseline so a follow-up save only sends fields changed since this one.
  Object.assign(CFG_INITIAL, updates);
  if (restart_required) {
    note.innerHTML = `<div class="banner warn">Saved. Some changes need a restart to take effect.
      <button id="do-restart" class="primary" style="margin-left:0.5rem;padding:0.3rem 0.8rem">Restart now</button></div>`;
    $('do-restart').addEventListener('click', doRestart);
  } else {
    note.innerHTML = `<div class="banner" style="border:1px solid var(--primary);color:var(--primary)">Saved and applied live — no restart needed.</div>`;
  }
}

// Restart the Fulloch process, then poll until it's back and reload (the loading
// screen takes over while models reload). Pass the clicked button to reflect state.
async function doRestart(ev) {
  const btn = ev && ev.target;
  if (btn) { btn.disabled = true; btn.textContent = 'Restarting…'; }
  try { await postJSON('/restart'); } catch (e) { /* server may drop the connection */ }
  let tries = 0;
  const poll = () => setTimeout(async () => {
    try { await getJSON('/status'); location.reload(); }
    catch (e) {
      if (++tries < 90) poll();
      else if (btn) { btn.disabled = false; btn.textContent = 'Restart now'; }
    }
  }, 2000);
  // Wait past the old server's ~0.5s exit before polling, so we don't catch it
  // still up and reload too early.
  setTimeout(poll, 3000);
}

boot();
