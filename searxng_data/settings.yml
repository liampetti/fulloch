# Slim SearXNG config — derived from settings.yml with the upstream comments
# and the full engine catalogue stripped out so it's easy to see what's running.
#
# Only four search engines are enabled: brave, startpage, mojeek and
# wikipedia. `use_default_settings.engines.keep_only` discards every other
# default engine; the `engines:` block below just makes sure the five we want
# are switched on (qwant ships disabled by default).
#
# To use: mount this over /etc/searxng/settings.yml (or rename to settings.yml)
# and restart the searxng container.

use_default_settings:
  engines:
    keep_only:
      - brave
      - startpage
      - qwant
      - mojeek
      - wikipedia

general:
  debug: false
  instance_name: "SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  # remove a format to deny access to it (lower case)
  formats:
    - html
    - json

server:
  # Overwritten by ${SEARXNG_PORT} / ${SEARXNG_BIND_ADDRESS}
  port: 8888
  bind_address: "127.0.0.1"
  base_url: false
  # rate limit / bot blocking — overwritten by ${SEARXNG_LIMITER}
  limiter: false
  public_instance: false
  secret_key: "supersecretkey"  # Overwritten by ${SEARXNG_SECRET}
  image_proxy: false
  http_protocol_version: "1.0"
  method: "POST"

ui:
  default_theme: simple

outgoing:
  # default per-request timeout to upstream engines (seconds)
  request_timeout: 3.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  - name: brave
    engine: brave
    shortcut: br
    disabled: false

  - name: startpage
    engine: startpage
    shortcut: sp
    startpage_categ: web
    categories: [general, web]
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mjk
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    # "infobox" for the side panel, "list" so it also appears in results
    display_type: ["infobox", "list"]
    categories: [general]
