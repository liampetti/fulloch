services:
  # Fulloch AI - GPU
  app:
    build:
      context: .
    env_file:
      - .env
    container_name: fulloch-ai
    network_mode: host
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_started
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
      # Route the container's "default" audio through specific Pulse/PipeWire
      # devices (PipeWire handles resampling, unlike a raw ALSA hw: device).
      # Defaults to the host's system-default source/sink; set PULSE_SOURCE /
      # PULSE_SINK in .env to pin a specific device by its pactl name.
      - PULSE_SOURCE=${PULSE_SOURCE:-@DEFAULT_SOURCE@}
      - PULSE_SINK=${PULSE_SINK:-@DEFAULT_SINK@}
    volumes:
      - ./data:/app/data:rw
      - ${XDG_RUNTIME_DIR}/pulse:${XDG_RUNTIME_DIR}/pulse:ro
      - ${HOME}/.config/pulse/cookie:/home/appuser/.config/pulse/cookie:ro
      # Inherit the host's timezone so `datetime.now()` in time_tools /
      # datetime_utils reports local wall-clock time (not UTC, which Docker
      # defaults to).
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # Liveness probe. Prefers the dashboard /status endpoint (catches a hung /
    # OOM process that's still "running" but no longer serving) and falls back
    # to a process check when the dashboard is disabled, served over HTTPS, or
    # on a non-default port. DASHBOARD_PORT (.env) must match
    # general.dashboard_port in data/config.yml for the curl probe to be the
    # deciding check; otherwise it degrades to the pgrep fallback. Only acted on
    # by an orchestrator / autoheal sidecar — plain `restart: unless-stopped`
    # ignores health status.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${DASHBOARD_PORT:-8765}/status || pgrep -f 'python app.py' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Web Search - Searxng
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    environment:
      # Overrides server.secret_key in searxng_data/settings.yml. Set in .env.
      # Only this var is passed (not env_file) to avoid leaking app creds here.
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng_data:/etc/searxng:rw
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
