[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fulloch"
# Must match custom_components/fulloch/manifest.json "version" — enforced by
# tests/test_version_consistency.py. Bump both together (and tag the release).
version = "2.3.0"
description = "A fully local, privacy-focused AI voice home assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Liam Pettigrew"}
]
keywords = [
    "voice-assistant",
    "home-automation",
    "speech-recognition",
    "text-to-speech",
    "local-ai",
    "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.dynamic]
# Runtime deps live in requirements.txt (single source of truth — the Docker
# build uses the same file, with the same pins).
dependencies = {file = ["requirements.txt"]}

[project.scripts]
fulloch = "app:main"

[project.urls]
Homepage = "https://github.com/liampetti/fulloch"
Documentation = "https://github.com/liampetti/fulloch#readme"
Repository = "https://github.com/liampetti/fulloch"
Issues = "https://github.com/liampetti/fulloch/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*", "utils*", "audio*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.yml", "*.yaml"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Ruff linter configuration
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Entry-point scripts deliberately import after env/logging/CUDA setup, so the
# imports-not-at-top rule (E402) doesn't apply to them. app.py also has a hard
# import-ordering constraint isort can't model (torch must load before
# llama_cpp), so import sorting (I001) is exempt there too.
"app.py" = ["E402", "I001"]
"scripts/voice_design.py" = ["E402"]

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

# Coverage configuration
[tool.coverage.run]
source = ["core", "tools", "utils"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
