# Fulloch Configuration Example — copy to config.yml and fill in your values.

# =============================================================================
# General Settings
# =============================================================================
general:
  wakeword: "hey atticus"       # Activation phrase (case-insensitive, multi-word ok); also the fallback if wakeword_pattern fails to compile
  wakeword_pattern: '\b(?:hey|hay|hi)\W+[ao][dtl]{1,2}i?c\W*u[sz]\b' # Optional case-insensitive regex override to tolerate ASR variants
  voice_clone: "atticus"
  barge_in: "wakeword"          # "off" (half-duplex) | "wakeword" (interrupt mid-response)
  follow_up_time: "5s"          # "0s" | "<N>s" — wakeword-free reply window after TTS, for back-and-forth in quiet rooms
  asr_language: "English"       # Force transcription to one language (English only for now)
  use_vad: true                 # Endpoint on Silero speech probability rather than mic energy — robust in noisy rooms, and drops non-speech (coughs, taps) before ASR. Falls back to RMS when off/unavailable.
  log_level: "info"           # "debug" | "info" | "warning" | "error" (debug = verbose project logs)

  # Mic/speaker device-name substrings (matched against PortAudio's device
  # list); null = system default. An absent name falls back to the default
  # rather than failing to start. NATIVE (non-Docker) path only — Windows in
  # particular, where PortAudio resamples. On Linux/Docker leave these null and
  # use PULSE_SOURCE / PULSE_SINK in .env: a substring here opens the raw ALSA
  # hw: device, which can't resample and fails on a rate mismatch.
  # input_device: null
  # output_device: null

  # Web chat UI. Set port to enable; unset disables.
  dashboard_port: 8765
  dashboard_host: "127.0.0.1"  # local-only (default)
  #
  # To reach it from another device on your network:
  #   1. dashboard_host: "0.0.0.0"            (bind to all interfaces)
  #   2. set FULLOCH_DASHBOARD_TOKEN in .env  (REQUIRED — the dashboard reads/
  #      writes notes, toggles the mic, speaks, and drives Home Assistant)
  #   3. (optional) HTTPS via the cert/key pair below
  # Then open http(s)://<host-ip>:8765/?token=<your-token> once; the browser
  # stores the token, so you can bookmark the bare URL afterwards.
  #
  # Optional HTTPS — both keys required, or TLS is skipped. Use mkcert for a
  # warning-free local cert. In Docker the files must live under ./data
  # (mounted into the container):
  # dashboard_ssl_certfile: "./data/certs/fulloch.pem"
  # dashboard_ssl_keyfile:  "./data/certs/fulloch-key.pem"

  # ---------------------------------------------------------------------------
  # Advanced tuning — all still under `general:`. Defaults (shown) suit most
  # setups; uncomment only to override. Mostly endpointing/barge-in thresholds
  # you'd tune against your mic and room.
  # ---------------------------------------------------------------------------
  # barge_in_threshold_dbfs: -48     # Silence floor while speaking, in dBFS. Keep low to improve barge-in. Raise it if the assistant interrupts itself or barge-in response time is too slow.
  # vad_threshold: 0.6               # Probability (0..1) above which a window counts as voice. Raise toward 0.7 in noisy rooms (cuts background chatter and cough false-triggers); lower for quiet/soft speech.
  # vad_endpoint_silence_ms: 1500    # Low-probability duration before end-of-speech is declared. Defaults to silence_duration_ms (1500).
  # vad_min_speech_ms: 300           # Min voiced duration to send to ASR (outside the follow-up window); filters coughs/taps VAD scores as speech. Raise to reject more noise.
  # vad_soft_endpoint_silence_ms: 500 # Early-commit pause: after this much silence a complete + speculation-safe command (lights/time/etc.) acts before the full endpoint above, cutting perceived latency. Locks/media/timers always wait for the hard endpoint. 0 disables. See docs/speculative-early-action.md.
  # asr_context_hint: true           # Bias the ASR decoder toward your wakeword spelling via a "Technical terms: <wakeword>" prompt (default true).
  # asr_context_terms:               # Extra terms appended after the wakeword — proper nouns/names that get mistranscribed (max 10).
  #   - "phoebe bridgers"
  #   - "downstairs office"

# =============================================================================
# Models — ASR / TTS / LLM backend selection
# =============================================================================
# Optional. Omit the whole block to run the default Qwen stack for your GPU or CPU setup. 
# Each domain takes a `backend` and an optional `model` (defaults come from core/backends.py). See docs for the wizard tiers.
#
# models:
#   asr:
#     backend: qwen          # qwen (Qwen3-ASR 1.7B, GPU default) | qwen-small (Qwen3-ASR 0.6B, GPU experimental) | qwen-onnx (Qwen3-ASR 1.7B ONNX, CPU default) | qwen-onnx-small (Qwen3-ASR 0.6B, CPU experimental) | moonshine (CPU experimental) | moonshine-tiny (CPU experimental)
#   tts:
#     backend: qwen          # qwen (Qwen3-TTS-Base 1.7B, GPU default) | qwen-small (Qwen3-TTS-Base 0.6B, GPU experimental) | kokoro-onnx (Kokoro-82m ONNX, CPU default)
#   llm:
#     backend: llama         # llama (Qwen3.5 9B, default) | gemma (Gemma 4 12B QAT, experimental) | none (regex-only) | openai (remote)
#     model: "./data/models/Qwen3.5-9B-UD-Q4_K_XL.gguf" # Custom model file location
#     n_context: 12288
#
# Advanced: an OpenAI-compatible remote LLM (llama.cpp server / vLLM / Ollama /
# hosted API). An unreachable endpoint degrades to regex-only commands.
#   llm:
#     backend: openai
#     model: "qwen2.5"              # optional; blank = the server's default (single-model servers ignore it)
#     base_url: "http://localhost:8888/v1"
#     api_key: ""                   # prefer FULLOCH_LLM_API_KEY in .env
#     connect_timeout: 0.4          # seconds; fail fast when the endpoint is down
#     read_timeout: 60              # seconds; raise if first-token latency is high
#
# llm.backend: none runs a regex-only assistant — basic commands (lights,
# timers, media, time) work; anything needing reasoning gets a spoken
# "basic commands only" reply. No SLM is loaded.

# =============================================================================
# Home Assistant — smart-home backend
# =============================================================================
# Create a long-lived token at http://<your-ha>:8123/profile.
# Rename entities in the HA UI to change the spoken name, then restart Fulloch.

# home_assistant:
#   url: "http://192.168.1.50:8123"
#   token: "your_long_lived_access_token"  # prefer FULLOCH_HA_TOKEN in .env — it takes
#                                            # priority and keeps the token out of config
#   timeout: 10
#   spotify_entity: "SpotifyPlus Atticus"  # Spotify media_player (friendly name or entity_id).
#                                            # Auto-detected (first media_player.spotify*); set
#                                            # only if autodetect picks wrong or fails.
#   todo_entity: "Shopping list"  # HA todo list for voice items (friendly name or entity_id).
#                                   # Auto-detected: todo.shopping_list, else first todo.*.
#   calendar: "Fulloch"   # HA calendar Fulloch writes reminders to. Create a Local (or Google)
#                          # Calendar named "Fulloch" in HA; Fulloch polls it every 60s and
#                          # speaks any event starting within 90s via speak_proactive.
#   reminder_poll: false  # Disable the polling thread — e.g. if a HA automation calls
#                          # fulloch.speak on calendar events, or you want no reminder audio.

# =============================================================================
# Always-Available Tools
# =============================================================================

# Notes — local markdown store (read / write / append / search).
# Leave commented for the default ./data/notes folder, or point `path` at an
# existing Obsidian vault (or any markdown folder).
# notes:
#   path: "./data/notes"      # where notes are stored
#   daily_subdir: "daily"     # optional: daily-journal notes go here as YYYY-MM-DD.md

search:
  searxng_url: "http://localhost:8080/search"
